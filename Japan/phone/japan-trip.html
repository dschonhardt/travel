","layer":"sights"},{"Name":"Rosanjin\u0027s Iroha Soan","Location":"Rosanjin Iroha Soan, Yamashiro Onsen, Kaga, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 5 about noon. Small house museum of the potter-chef Rosanjin in Yamashiro Onsen. 9 AM-5 PM, last entry 4:30. About 560 yen. Closed Wed. The CAN Bus stop to Natadera is named after it","layer":"sights"},{"Name":"Kakusenkei Gorge","Location":"Kakusenkei Gorge, Yamanaka Onsen, Kaga, Ishikawa, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Nov 5 about 9 AM, first stop. Walk along the Daishoji River between Korogi Bridge and Kurotani Bridge, past the S-shaped Ayatori Bridge. 1-1.5 hrs. Foliage around early to mid Nov","layer":"sights"},{"Name":"Yuge Kaido (Yamanaka Onsen)","Location":"Yuge Kaido, Yamanaka Onsen, Kaga, Ishikawa, Japan","City":"Kanazawa","Type":"Shopping","Notes":"Nov 5 about 10:30 AM, then an early lunch here. Main street of Yamanaka Onsen. Yamanaka lacquerware shops and snacks. The Ohanami Kyubei private bath and Mokume workshop are closed Thursdays. Bus to Yamashiro 11:43","layer":"sights"},{"Name":"Kazuemachi","Location":"Kazuemachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 7 ~10:50 AM, after the sake flight. Quietest geisha district, along the Asano River across from Higashi Chaya","layer":"sights"},{"Name":"Kenrokuen Garden","Location":"Kenrokuen Garden, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 about 8:15 AM (opens 8 AM, 320 yen). One of Japan\u0027s three great gardens. Yukitsuri ropes going up from Nov 1. Tea at Shigure-tei inside from 9 AM. Autumn light-up Sat Nov 7 night (skipped)","layer":"sights"},{"Name":"Kanazawa Castle Park","Location":"Kanazawa Castle Park, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 morning. Free to walk the grounds, Ishikawa Gate, rebuilt turrets. Autumn light-up with Kenrokuen Sat Nov 7 (free night entry, only works with a late train)","layer":"sights"},{"Name":"Ishiura Shrine","Location":"Ishiura Shrine, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 ~9:20 AM, out the Mayumizaka Gate of Kenrokuen. Tunnel of red torii gates like a mini Fushimi Inari","layer":"sights"},{"Name":"21st Century Museum of Contemporary Art","Location":"21st Century Museum of Contemporary Art, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Probably skipping. Swimming Pool installation. Open until 8 PM Fridays","layer":"sights"},{"Name":"D.T. Suzuki Museum","Location":"D.T. Suzuki Museum, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Probably skipping. Minimalist Zen museum with a water mirror courtyard. About 45 min. Near the 21st Century Museum","layer":"sights"},{"Name":"Myoryuji (Ninja Temple)","Location":"Myoryuji, Teramachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 2:30 PM tour (book by phone, +81-76-241-0888). Trick doors and hidden stairs. Guided tour only, about 40 min","layer":"sights"},{"Name":"Nishi Chaya District","Location":"Nishi Chaya District, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 at 4:50 PM for sunset (about 4:52), between rounds at Sink. Smaller, quieter geisha district next to Teramachi","layer":"sights"},{"Name":"Teramachi Temple District","Location":"Teramachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 ~3:15 PM after Myoryuji. About 70 temples in a few blocks south of the Sai River. Hoshoji temple café until 4 PM","layer":"sights"},{"Name":"Higashi Chaya District","Location":"Higashi Chaya District, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 7 about 9:30 AM, while quiet. Geisha teahouse district, gold-leaf shops. Step inside Shima and have matcha with a seasonal wagashi. Optional gold-leaf workshop (HAKUICHI or Kinpakuya Sakuda, check times)","layer":"sights"},{"Name":"Kanazawa Phonograph Museum","Location":"Kanazawa Phonograph Museum, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Probably skipping. Antique gramophones with live listening demos. Near Higashi Chaya","layer":"sights"},{"Name":"Gokayama (Ainokura)","Location":"Ainokura, Gokayama, Nanto, Toyama, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Candidate, not scheduled. Quieter UNESCO gassho-zukuri village, a substitute for Shirakawa-go. Shinkansen to Shin-Takaoka, then the World Heritage Bus (about 1 hr). Infrequent buses","layer":"sights"},{"Name":"Zuiryuji Temple","Location":"Zuiryuji, Takaoka, Toyama, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Candidate, not scheduled. National Treasure Zen temple in Takaoka, on the way to Gokayama. Takaoka Great Buddha nearby","layer":"sights"},{"Name":"Eiheiji","Location":"Eiheiji Temple, Eiheiji, Fukui, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Candidate, not scheduled. Working Zen training temple (1244), 70+ buildings in a cedar forest. Shinkansen to Fukui, then bus. Full day with Tojinbo","layer":"sights"},{"Name":"Tojinbo","Location":"Tojinbo, Sakai, Fukui, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Candidate, not scheduled. Basalt sea cliffs. Pairs with Eiheiji","layer":"sights"},{"Name":"Fukui Prefectural Dinosaur Museum","Location":"Fukui Prefectural Dinosaur Museum, Katsuyama, Fukui, Japan","City":"Kanazawa","Type":"Day trip","Notes":"Candidate, not scheduled. One of the world\u0027s big dinosaur museums. Full day, pairs with Eiheiji","layer":"sights"},{"Name":"Kourinji","Location":"Kourinji, Nomachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 ~3:15 PM, next to Myoryuji. Zen \"wish temple\" (1651) with a twelve-zodiac garden and Daruma wish balls","layer":"sights"},{"Name":"Houenji","Location":"Houenji, Nomachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 ~3:15 PM, near Myoryuji. Maeda family temple (1581) with Toshiie\u0027s hair and self-portrait, 4.5 m Nio guardian statues","layer":"sights"},{"Name":"Kanazawa Shrine","Location":"Kanazawa Shrine, Kenrokumachi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 morning, on the edge of Kenrokuen (2 min)","layer":"sights"},{"Name":"Shigure-tei","Location":"Shigure-tei, Kenrokuen, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 about 9:15 AM. Teahouse inside Kenrokuen. Matcha and wagashi about 730 yen, from 9 AM. About 20 min","layer":"sights"},{"Name":"Ozaki Shrine","Location":"Ozaki Shrine, Marunouchi, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 6 late morning, on the Omicho side of the castle. Good autumn leaves. About 15 min walk to Omicho","layer":"sights"},{"Name":"Shima Geisha House","Location":"Shima, Higashi Chaya, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Sight","Notes":"Nov 7 about 9:30 AM. Edo-era geisha house you can go inside. 9:30 AM-5:30 PM, 500 yen","layer":"sights"},{"Name":"Haneda Airport (HND)","Location":"Haneda Airport, Ota, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Land Oct 27 at 2:35 PM (Delta 121). Leave Nov 11 at 5:15 PM (Delta 120). Toei Asakusa Line runs through to Haneda from Asakusabashi","layer":"transport"},{"Name":"Asakusabashi Station","Location":"Asakusabashi Station, Taito, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Next to the first hotel. JR Chuo-Sobu local and Toei Asakusa Line (direct to HND and Oshiage)","layer":"transport"},{"Name":"Bakurocho Station","Location":"Bakurocho Station, Chuo, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"5-7 min walk from the first hotel. JR Yokosuka Line straight to Kita-Kamakura on Oct 29","layer":"transport"},{"Name":"Ryogoku Station","Location":"Ryogoku Station, Sumida, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Next to the second hotel. JR Sobu Line, 2 stops to Akihabara and 1 to Asakusabashi","layer":"transport"},{"Name":"Akihabara Station (Tsukuba Express)","Location":"Akihabara Station, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Nov 9 about 7:50 AM. TX Rapid to Tsukuba, pay with IC card. Also TX from Asakusa to here on Oct 28 about 2:15 PM","layer":"transport"},{"Name":"Tokyo Station","Location":"Tokyo Station, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Oct 31 Nozomi 141 to Nagoya departs 9:45 AM (booked). Sit on the right side (D/E seats) for Mt. Fuji. Arrive from Kanazawa Nov 7 at 4:20 PM on Kagayaki 534 (not booked yet)","layer":"transport"},{"Name":"Kuramae Station","Location":"Kuramae Station, Taito, Tokyo, Japan","City":"Tokyo","Type":"Transport","Notes":"Other way to HND on Nov 11. About 13 min walk from the Ryogoku hotel, Asakusa Line with no JR leg. Route not confirmed yet","layer":"transport"},{"Name":"Kita-Kamakura Station","Location":"Kita-Kamakura Station, Kamakura, Kanagawa, Japan","City":"Tokyo","Type":"Transport","Notes":"Oct 29. Get off here, one stop before Kamakura. About 1 hr from Bakurocho on the Yokosuka Line","layer":"transport"},{"Name":"Kamakura Station","Location":"Kamakura Station, Kamakura, Kanagawa, Japan","City":"Tokyo","Type":"Transport","Notes":"Oct 29. Enoden to Enoshima from here. Leave by 3 PM. Sit on the ocean side","layer":"transport"},{"Name":"Shonan-Enoshima Station","Location":"Shonan-Enoshima Station, Fujisawa, Kanagawa, Japan","City":"Tokyo","Type":"Transport","Notes":"Oct 29 return. Shonan Monorail to Ofuna, then Yokosuka Line back to Bakurocho","layer":"transport"},{"Name":"Tsukuba Station","Location":"Tsukuba Station, Tsukuba, Ibaraki, Japan","City":"Tokyo","Type":"Transport","Notes":"Nov 9. TX Rapid from Akihabara about 45 min. Shuttle bus leaves from stop 1 at Tsukuba Center. Last toilet and konbini stop","layer":"transport"},{"Name":"Tsukubasan-jinja-iriguchi bus stop","Location":"Tsukubasan Jinja Iriguchi, Tsukuba, Ibaraki, Japan","City":"Tokyo","Type":"Transport","Notes":"Nov 9. Shuttle bus stop for the shrine, about 38 min from Tsukuba Center. Last weekday bus back is 5:15 PM. Check the pin location","layer":"transport"},{"Name":"Nagoya Station","Location":"Nagoya Station, Nakamura Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Transport","Notes":"Arrive Oct 31 at 11:23 AM on Nozomi 141 from Tokyo. Hida 5 to Takayama leaves Nov 2 at 9:39 AM (booked). Print the ticket at a machine and be on the platform by 9:25. Sit on the right side (A seats) for the gorge","layer":"transport"},{"Name":"Hisaya-odori Station","Location":"Hisaya-odori Station, Naka Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Transport","Notes":"The hotel\u0027s station, about 4 min walk. Sakuradori Line 3 stops to Nagoya Station. Meijo Line 2 stops to Yaba-cho (Oct 31), 1 stop to Nagoyajo and 7 stops to Atsuta Jingu Nishi (Nov 1). Mirai Tower is right here","layer":"transport"},{"Name":"Kintetsu Nagoya Station","Location":"Kintetsu Nagoya Station, Nakamura Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Transport","Notes":"Nov 1 about 4:30 PM. Buy the Nabana no Sato illumination set ticket (3670 yen: round-trip Kintetsu and bus, admission and the 1000 yen voucher) at the limited-express ticket window. Kintetsu has its own station under Nagoya Station next to Meitetsu, not on the JR side","layer":"transport"},{"Name":"Kintetsu Nagashima Station","Location":"Kintetsu Nagashima Station, Kuwana, Mie, Japan","City":"Nagoya","Type":"Transport","Notes":"Nov 1 about 4:45 PM on the way to Nabana no Sato. About 22 min from Kintetsu Nagoya (weekend expresses stop here from Oct 31), then the direct bus about 10 min. Last bus back from Nabana is about 10 PM on Sundays","layer":"transport"},{"Name":"JR Takayama Station","Location":"Takayama Station, Takayama, Gifu, Japan","City":"Takayama","Type":"Transport","Notes":"Arrive Nov 2 about 12:15 PM on Hida 5 from Nagoya (booked). Buy the Nov 4 Hida 3 reserved seat here on arrival. Hida 3 leaves Nov 4 at 11:03 AM for Toyama. Coin lockers here","layer":"transport"},{"Name":"Takayama Nohi Bus Center","Location":"Takayama Nohi Bus Center, Takayama, Gifu, Japan","City":"Takayama","Type":"Transport","Notes":"Kamikochi buses Nov 3. Across from JR Takayama Station. Buy the Takayama to Kamikochi round-trip ticket at the counter. Line up by 6:40 for the 7 AM bus. No reservations and it is a holiday","layer":"transport"},{"Name":"Hirayu Onsen Bus Terminal","Location":"Hirayu Onsen Bus Terminal, Takayama, Gifu, Japan","City":"Takayama","Type":"Transport","Notes":"Transfer point Nov 3 between the Takayama bus and the Kamikochi shuttle. About 1 hr from Takayama. Shuttle runs through Nov 15","layer":"transport"},{"Name":"Kamikochi Bus Terminal","Location":"Kamikochi Bus Terminal, Kamikochi, Matsumoto, Nagano, Japan","City":"Takayama","Type":"Transport","Notes":"Arrive Nov 3 about 8:30 AM. First get a free numbered return ticket at the Kamikochi Sightseeing Center window here. Plan is the 4 PM bus back. Last connection to Takayama is 5 PM","layer":"transport"},{"Name":"Toyama Station","Location":"Toyama Station, Toyama, Toyama, Japan","City":"Takayama","Type":"Transport","Notes":"Nov 4 transfer. Hida 3 arrives 12:32 PM. Tsurugi 23 Shinkansen at 12:41 to Kanazawa (1:03). Backups: Hakutaka 559 at 1:14 or the Ainokaze/IR local at 1:20 (Kanazawa 2:19)","layer":"transport"},{"Name":"Kanazawa Station","Location":"Kanazawa Station, Kanazawa, Ishikawa, Japan","City":"Kanazawa","Type":"Transport","Notes":"Arrive Nov 4 at 1:03 PM from Toyama. IR Ishikawa local to Kaga Onsen at 7:32 AM Nov 5. Kagayaki 534 to Tokyo Nov 7 at 1:50 PM (not booked yet). Loop Bus and Kenrokuen Shuttle leave from the east exit","layer":"transport"},{"Name":"Kaga Onsen Station","Location":"Kaga Onsen Station, Kaga, Ishikawa, Japan","City":"Kanazawa","Type":"Transport","Notes":"Nov 5. About 46 min on the IR Ishikawa local from Kanazawa. Hokutetsu bus to Yamanaka from stop 2 at 8:35 AM (no IC cards: cash or contactless credit card). CAN Bus is 500 yen per ride paid on board, so skip the day pass. Tsurugi 26 back to Kanazawa at 3:20 PM","layer":"transport"}]}</script>
<script>
(function () {
  const view = document.getElementById('view');
  try {
    const DATA = JSON.parse(document.getElementById('trip-data').textContent);
    const KANJI = ['日', '月', '火', '水', '木', '金', '土'];
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const LAYER_LABEL = { 'food': 'Food', 'alcohol-and-bars': 'Bars', 'sights': 'Sights', 'transport': 'Transport', 'hotels': 'Hotels' };
    const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';

    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
    const slug = s => s.toLowerCase().replace(/[*`_]/g, '').replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s/g, '-');
    const norm = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[^a-z0-9぀-ヿ一-鿿]+/g, ' ').trim();
    const mapUrl = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.Location || p.Name);

    // ---- Japan time ----
    const jstParts = () => {
      const f = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      const o = {}; f.formatToParts(new Date()).forEach(p => { o[p.type] = p.value; });
      return { date: `${o.year}-${o.month}-${o.day}`, min: (+o.hour % 24) * 60 + +o.minute, h: +o.hour % 24, m: +o.minute };
    };

    // ---- Places ----
    const PLACES = (DATA.places || []).map((p, i) => Object.assign({}, p, { i, n: norm(p.Name || '') }));
    const CITIES = [...new Set(PLACES.map(p => p.City).filter(Boolean))];
    const matchCache = new Map();
    function findPlace(text, cities, list) {
      const b = norm(text);
      if (!b || b.length < 4 || /^\d/.test(b) || b.split(' ').length > 7) return null;
      const key = b + '|' + cities.join(',') + '|' + (list ? 'h' : 'a');
      if (matchCache.has(key)) return matchCache.get(key);
      const bw = b.split(' ').length;
      let best = null, score = -1;
      for (const p of (list || PLACES)) {
        if (!p.n) continue;
        let s = -1;
        if (p.n === b) s = 100;
        else if (b.length >= 6 && (' ' + p.n + ' ').includes(' ' + b + ' ') && p.n.split(' ').length <= bw + 2) s = 60 - (p.n.length - b.length) / 10;
        else if (p.n.length >= 6 && (' ' + b + ' ').includes(' ' + p.n + ' ')) s = 50 + p.n.length / 10;
        if (s < 0) continue;
        if (cities.includes(p.City)) s += 20;
        if (s > score) { score = s; best = p; }
      }
      matchCache.set(key, best);
      return best;
    }

    // ---- Days ----
    const DAYS = DATA.days.map(d => {
      const lines = d.md.replace(/\r/g, '').split('\n');
      const h1 = (lines.find(l => /^#\s/.test(l)) || '').replace(/^#\s+/, '');
      const parts = h1.split(/\s+—\s+/);
      const rest = parts.slice(2).join(' — ');
      const pm = rest.match(/^(.*?)\s*\((.*)\)\s*$/);
      const [y, mo, da] = d.id.split('-').map(Number);
      const dt = new Date(Date.UTC(y, mo - 1, da));
      return {
        id: d.id, md: d.md, num: (parts[0] || '').replace(/^Day\s*/i, ''),
        city: pm ? pm[1] : rest, subtitle: pm ? pm[2] : '',
        wd: dt.getUTCDay(), mon: dt.getUTCMonth(), day: dt.getUTCDate(),
        cities: CITIES.filter(c => h1.includes(c))
      };
    });
    const DAY_BY_ID = Object.fromEntries(DAYS.map(d => [d.id, d]));
    const dayIndex = id => DAYS.findIndex(d => d.id === id);
    const longDate = d => `${WD[d.wd]} ${MON[d.mon]} ${d.day}`;
    function todayId() {
      const t = jstParts().date;
      if (t < DAYS[0].id) return DAYS[0].id;
      if (t > DAYS[DAYS.length - 1].id) return DAYS[DAYS.length - 1].id;
      return DAY_BY_ID[t] ? t : DAYS.filter(d => d.id <= t).pop().id;
    }

    // ---- Markdown: blocks ----
    function parseBlocks(md) {
      const L = md.replace(/\r/g, '').split('\n'); const out = []; let para = [];
      const flush = () => { if (para.length) { out.push({ t: 'p', text: para.join(' ') }); para = []; } };
      const row = l => { let s = l.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|')) s = s.slice(0, -1); return s.split('|').map(c => c.trim()); };
      const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)/;
      for (let i = 0; i < L.length; i++) {
        const l = L[i]; let m;
        if (!l.trim()) { flush(); continue; }
        if ((m = l.match(/^(#{1,6})\s+(.*)/))) { flush(); out.push({ t: 'h', level: m[1].length, text: m[2] }); continue; }
        if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push({ t: 'hr' }); continue; }
        if (l.trim().startsWith('|') && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
          flush(); const head = row(l); const rows = []; i += 2;
          while (i < L.length && L[i].trim().startsWith('|')) { rows.push(row(L[i])); i++; }
          i--; out.push({ t: 'table', head, rows }); continue;
        }
        if (LI.test(l)) {
          flush(); const items = [];
          while (i < L.length) {
            const x = L[i]; const mm = x.match(LI);
            if (mm) { items.push({ ind: mm[1].length, ord: /\d/.test(mm[2]), text: mm[3] }); i++; }
            else if (x.trim() && /^\s{2,}/.test(x) && items.length) { items[items.length - 1].text += ' ' + x.trim(); i++; }
            else break;
          }
          i--; out.push({ t: 'list', items }); continue;
        }
        para.push(l.trim());
      }
      flush(); return out;
    }

    // ---- Markdown: inline ----
    function pin(name, ctx) {
      if (!ctx || ctx.noPins) return '';
      const p = findPlace(name, ctx.cities || []);
      if (!p || ctx.pins.has(p.i)) return '';
      ctx.pins.add(p.i);
      return `<a class="pin" href="${esc(mapUrl(p))}" target="_blank" rel="noopener" aria-label="Map: ${esc(p.Name)}" title="${esc(p.Name)}">${PIN_SVG}</a>`;
    }
    function fmt(s, ctx) {
      s = esc(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.+?)\*\*/g, (m, t) => '<strong>' + t + '</strong>' + pin(unesc(t.replace(/<[^>]+>/g, '')), ctx));
      s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<em>$2</em>');
      return s;
    }
    function link(text, url, ctx) {
      const label = fmt(text, Object.assign({}, ctx, { noPins: true }));
      const m = url.match(/(\d{4}-\d{2}-\d{2})\.md/);
      if (m && DAY_BY_ID[m[1]]) return `<a href="#d${m[1]}" data-day="${m[1]}">${label}</a>`;
      if (url.startsWith('#')) return `<a href="#" data-anchor="${esc(url.slice(1))}">${label}</a>`;
      if (/^https?:/i.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;
      return `<span class="xref">${label}</span>`;
    }
    function inline(src, ctx) {
      const toks = [];
      const hold = h => '\u0001' + (toks.push(h) - 1) + '\u0002';
      let s = String(src).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => hold(link(t, u, ctx)));
      s = fmt(s, ctx);
      return s.replace(/\u0001(\d+)\u0002/g, (m, i) => toks[+i]);
    }

    // ---- Markdown: render ----
    const parseMin = cell => {
      const s = cell.replace(/\*/g, ''); const m = s.match(/(\d{1,2}):(\d{2})/);
      if (!m) return '';
      const ap = (s.match(/\b(AM|PM)\b/) || [])[1]; let h = +m[1];
      if (ap === 'PM' && h < 12) h += 12; if (ap === 'AM' && h === 12) h = 0;
      return h * 60 + +m[2];
    };
    function renderList(items, mk) {
      let html = ''; const stack = [];
      for (const it of items) {
        while (stack.length && it.ind < stack[stack.length - 1].ind) html += '</li></' + stack.pop().tag + '>';
        const top = stack[stack.length - 1];
        if (!top || it.ind > top.ind) { const tag = it.ord ? 'ol' : 'ul'; stack.push({ ind: it.ind, tag }); html += '<' + tag + '>'; }
        else html += '</li>';
        const tm = it.text.match(/^\[( |x|X)\]\s+(.*)/);
        if (tm) {
          const done = tm[1] !== ' ';
          html += `<li class="task${done ? ' done' : ''}"><span class="box" aria-label="${done ? 'Done' : 'Open'}">${done ? '✓' : ''}</span><span>${inline(tm[2], mk())}</span>`;
        } else html += '<li>' + inline(it.text, mk());
      }
      while (stack.length) html += '</li></' + stack.pop().tag + '>';
      return html;
    }
    function renderTable(b, mk, main) {
      if (/time|^when$/i.test(b.head[0] || '') && b.head.length === 2) {
        return `<ol class="tl${main ? ' tl-main' : ''}">` + b.rows.map(r => {
          const fixed = /\*\*/.test(r[0]);
          const t = inline(r[0].replace(/\*\*/g, ''), { noPins: true }).replace(/\b(AM|PM)\b/g, '<span class="ap">$1</span>');
          return `<li class="tl-item${fixed ? ' fixed' : ''}" data-min="${parseMin(r[0])}"><div class="tl-time">${t}</div><div class="tl-body">${inline(r[1] || '', mk())}</div></li>`;
        }).join('') + '</ol>';
      }
      return '<div class="cards">' + b.rows.map(r =>
        `<article class="card"><h4>${inline(r[0] || '', mk())}</h4><dl>` +
        b.head.slice(1).map((h, j) => r[j + 1] ? `<dt>${inline(h, { noPins: true })}</dt><dd>${inline(r[j + 1], mk())}</dd>` : '').join('') +
        '</dl></article>').join('') + '</div>';
    }
    function renderBlocks(blocks, mk, opts) {
      opts = opts || {};
      let html = ''; let firstTl = !!opts.mainTimeline;
      for (const b of blocks) {
        if (b.t === 'p') {
          const isNote = opts.notes && /^(All times|_|\*[^*])/.test(b.text);
          html += `<p${isNote ? ' class="note"' : ''}>${inline(b.text, mk())}</p>`;
        } else if (b.t === 'h') html += `<h4 id="${esc(opts.prefix + slug(b.text))}">${inline(b.text, { noPins: true })}</h4>`;
        else if (b.t === 'hr') html += '<hr>';
        else if (b.t === 'list') html += renderList(b.items, mk);
        else if (b.t === 'table') { html += renderTable(b, mk, firstTl); firstTl = false; }
      }
      return html;
    }

    // ---- Views ----
    const strip = document.getElementById('strip');
    let state = { tab: 'today', day: todayId() };

    function renderStrip() {
      const tid = jstParts().date;
      strip.innerHTML = DAYS.map(d =>
        `<a class="chip-day${d.id === tid ? ' is-today' : ''}${state.tab !== 'places' && state.tab !== 'days' && d.id === state.day ? ' is-active' : ''}" href="#d${d.id}" data-day="${d.id}" aria-label="${esc(longDate(d) + ', ' + d.city)}">` +
        `<span class="mo">${MON[d.mon]}</span><span class="dn">${d.day}</span><span class="kj">${KANJI[d.wd]}</span></a>`).join('');
      const act = strip.querySelector('.is-active');
      if (act) strip.scrollLeft = act.offsetLeft - strip.clientWidth / 2 + act.offsetWidth / 2;
    }

    function tonightHotel(d) {
      const hotels = PLACES.filter(p => p.layer === 'hotels');
      const lod = sectionsOf(d).find(s => /^lodging/i.test(s.title));
      if (!lod) {
        const nx = DAYS[dayIndex(d.id) + 1];
        return nx ? tonightHotel(nx) : null;
      }
      let found = null;
      lod.body.split('\n').forEach(l => {
        if (/^\s*-\s*check out/i.test(l)) return;
        const m = l.match(/\*\*(.+?)\*\*/);
        if (m) { const p = findPlace(m[1], [], hotels); if (p) found = p; }
      });
      return found;
    }

    function sectionsOf(d) {
      const lines = d.md.replace(/\r/g, '').split('\n');
      const secs = []; let cur = { title: '', body: [] };
      for (const l of lines) {
        if (/^#\s/.test(l)) continue;
        const m = l.match(/^##\s+(.*)/);
        if (m) { secs.push(cur); cur = { title: m[1].trim(), body: [] }; } else cur.body.push(l);
      }
      secs.push(cur);
      return secs.map(s => ({ title: s.title, body: s.body.join('\n') }));
    }

    function renderDay(id) {
      const d = DAY_BY_ID[id]; const idx = dayIndex(id);
      const isToday = jstParts().date === id;
      const mk = () => ({ cities: d.cities, pins: new Set() });
      const secs = sectionsOf(d);
      const intro = secs[0]; const rest = secs.slice(1).filter(s => s.body.trim());
      const hotel = tonightHotel(d);
      const last = idx === DAYS.length - 1;
      const prefix = 's-';
      let html = `<section class="head">
        <div class="eyebrow"><span>Day ${esc(d.num)} · ${esc(longDate(d))}</span>${isToday ? '<span class="badge-today">Today</span>' : ''}</div>
        <h1>${esc(d.city)}</h1>
        ${d.subtitle ? `<p class="sub">${esc(d.subtitle)}</p>` : ''}
        ${hotel && !last ? `<div class="hotel"><div class="hotel-txt"><small>Tonight</small>${esc(hotel.Name)}</div><a class="btn" href="${esc(mapUrl(hotel))}" target="_blank" rel="noopener">${PIN_SVG}Map</a></div>` : ''}
        <div class="jumps">${isToday ? '<button type="button" class="jump now" data-now>Jump to now</button>' : ''}${rest.map(s => `<button type="button" class="jump" data-anchor="${esc(slug(s.title))}">${esc(s.title)}</button>`).join('')}</div>
      </section>`;
      if (intro.body.trim()) html += `<div class="prose">${renderBlocks(parseBlocks(intro.body), mk, { prefix })}</div>`;
      for (const s of rest) {
        const isPlan = /^plan$/i.test(s.title);
        const inner = `<div class="prose">${renderBlocks(parseBlocks(s.body), mk, { prefix, mainTimeline: isPlan, notes: isPlan })}</div>`;
        html += isPlan
          ? `<section class="sec" id="${prefix}${esc(slug(s.title))}"><h2 class="sec-h">${inline(s.title, { noPins: true })}</h2>${inner}</section>`
          : `<details class="sec" id="${prefix}${esc(slug(s.title))}" open><summary>${inline(s.title, { noPins: true })}</summary>${inner}</details>`;
      }
      const prev = DAYS[idx - 1], next = DAYS[idx + 1];
      html += `<nav class="pager" aria-label="Previous and next day">
        ${prev ? `<a class="prev" href="#d${prev.id}" data-day="${prev.id}"><small>‹ Day ${esc(prev.num)}</small><span>${esc(longDate(prev))}</span></a>` : ''}
        ${next ? `<a class="next" href="#d${next.id}" data-day="${next.id}"><small>Day ${esc(next.num)} ›</small><span>${esc(longDate(next))}</span></a>` : ''}
      </nav>`;
      view.innerHTML = html;
      markNow();
    }

    function markNow() {
      const tl = view.querySelector('.tl-main');
      if (!tl) return;
      const items = [...tl.querySelectorAll('.tl-item')];
      items.forEach(li => li.classList.remove('is-now', 'is-past'));
      if (jstParts().date !== state.day || state.tab === 'days' || state.tab === 'places') return;
      const now = jstParts().min; let cur = -1;
      items.forEach((li, i) => { const m = li.dataset.min; if (m !== '' && +m <= now) cur = i; });
      items.forEach((li, i) => { if (i < cur) li.classList.add('is-past'); if (i === cur) li.classList.add('is-now'); });
    }

    function renderDays() {
      const tid = jstParts().date;
      let html = '<div class="head"><div class="eyebrow">Oct 27 – Nov 11 · 16 days</div><h1>All days</h1></div><ul class="days">';
      let leg = null;
      for (const d of DAYS) {
        const base = d.city.split('→').pop().trim().split(' ')[0];
        if (base !== leg) { html += `<li class="leg">${esc(base)}</li>`; leg = base; }
        html += `<li><a class="day-row${d.id === tid ? ' is-today' : ''}" href="#d${d.id}" data-day="${d.id}">
          <span class="day-date"><span class="mo">${MON[d.mon]}</span><span class="dn">${d.day}</span><span class="kj">${KANJI[d.wd]}</span></span>
          <span><b>${esc(d.city)}</b>${d.subtitle ? `<span class="s">${esc(d.subtitle)}</span>` : ''}</span></a></li>`;
      }
      html += `</ul><p class="built">Built ${esc(DATA.built || '')} from the trip notes</p>`;
      view.innerHTML = html;
    }

    const pf = { q: '', city: 'All', layer: 'All' };
    function noteHtml(s) {
      return esc(s).replace(/\b(Oct|Nov)\s+(\d{1,2})\b/g, (m, mo, dd) => {
        const id = `2026-${mo === 'Oct' ? '10' : '11'}-${String(dd).padStart(2, '0')}`;
        return DAY_BY_ID[id] ? `<a href="#d${id}" data-day="${id}">${m}</a>` : m;
      });
    }
    function renderPlaces() {
      const cityCounts = {}; PLACES.forEach(p => { cityCounts[p.City] = (cityCounts[p.City] || 0) + 1; });
      const cities = ['All'].concat(Object.keys(cityCounts).sort((a, b) => cityCounts[b] - cityCounts[a]));
      const layers = ['All'].concat(Object.keys(LAYER_LABEL).filter(l => PLACES.some(p => p.layer === l)));
      view.innerHTML = `<div class="head"><div class="eyebrow">From the map layers</div><h1>Places</h1></div>
        <div class="filters">
          <input class="search" id="place-search" type="search" placeholder="Search names and notes" autocomplete="off" value="${esc(pf.q)}">
          <div class="chips" role="group" aria-label="City">${cities.map(c => `<button type="button" data-city="${esc(c)}" aria-pressed="${pf.city === c}">${esc(c)}</button>`).join('')}</div>
          <div class="chips" role="group" aria-label="Type">${layers.map(l => `<button type="button" data-layer="${esc(l)}" aria-pressed="${pf.layer === l}">${esc(LAYER_LABEL[l] || l)}</button>`).join('')}</div>
        </div>
        <div class="count" id="place-count"></div>
        <ul class="places" id="place-list"></ul>
        <p class="built">Built ${esc(DATA.built || '')} from the trip notes</p>`;
      document.getElementById('place-search').addEventListener('input', e => { pf.q = e.target.value; renderPlaceList(); });
      renderPlaceList();
    }
    function renderPlaceList() {
      const q = norm(pf.q);
      const rows = PLACES.filter(p => (pf.city === 'All' || p.City === pf.city) && (pf.layer === 'All' || p.layer === pf.layer) &&
        (!q || norm(p.Name + ' ' + (p.Notes || '') + ' ' + (p.Type || '')).includes(q)));
      document.getElementById('place-count').textContent = `${rows.length} place${rows.length === 1 ? '' : 's'}`;
      document.getElementById('place-list').innerHTML = rows.length ? rows.map(p => `<li class="place">
        <div class="place-top"><div><b>${esc(p.Name)}</b><span class="meta">${esc([p.Type, p.City].filter(Boolean).join(' · '))}</span></div>
        <a class="btn" href="${esc(mapUrl(p))}" target="_blank" rel="noopener">${PIN_SVG}Map</a></div>
        ${p.Notes ? `<p>${noteHtml(p.Notes)}</p>` : ''}</li>`).join('') : '<li class="empty">No places match. Try another city or clear the search.</li>';
    }

    // ---- Routing ----
    function setNav() {
      document.querySelectorAll('.nav button').forEach(b => {
        const on = b.dataset.tab === state.tab || (b.dataset.tab === 'today' && state.tab === 'day' && state.day === todayId());
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
    }
    function render() {
      if (state.tab === 'days') renderDays();
      else if (state.tab === 'places') renderPlaces();
      else renderDay(state.day);
      renderStrip(); setNav();
    }
    function go(tab, day, push) {
      state = { tab, day: day || state.day };
      const h = tab === 'days' ? 'days' : tab === 'places' ? 'places' : 'd' + state.day;
      if (push) { try { if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); } catch (e) { /* hash optional */ } }
      render(); window.scrollTo(0, 0);
    }
    function fromHash() {
      const h = (location.hash || '').slice(1);
      if (h === 'days' || h === 'places') return go(h, null, false);
      const m = h.match(/^d(\d{4}-\d{2}-\d{2})$/);
      if (m && DAY_BY_ID[m[1]]) return go('day', m[1], false);
      go('today', todayId(), false);
    }
    window.addEventListener('popstate', fromHash);
    window.addEventListener('hashchange', fromHash);

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-day],[data-tab],[data-anchor],[data-now],[data-city],[data-layer]');
      if (!t) return;
      if (t.dataset.day) { e.preventDefault(); go('day', t.dataset.day, true); }
      else if (t.dataset.tab) { t.dataset.tab === 'today' ? go('today', todayId(), true) : go(t.dataset.tab, null, true); }
      else if (t.dataset.anchor !== undefined) {
        e.preventDefault();
        const el = document.getElementById('s-' + t.dataset.anchor);
        if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      } else if (t.dataset.now !== undefined) {
        const el = view.querySelector('.tl-item.is-now') || view.querySelector('.tl-main');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (t.dataset.city) { pf.city = t.dataset.city; renderPlaces(); }
      else if (t.dataset.layer) { pf.layer = t.dataset.layer; renderPlaces(); }
    });

    // ---- Clock ----
    const clock = document.getElementById('clock');
    function tick() {
      const j = jstParts(); const h12 = j.h % 12 || 12;
      clock.innerHTML = `Japan <b>${h12}:${String(j.m).padStart(2, '0')} ${j.h < 12 ? 'AM' : 'PM'}</b>`;
      markNow();
    }
    tick(); setInterval(tick, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

    fromHash();
  } catch (err) {
    view.innerHTML = '<div class="err">The trip page could not load: ' + String(err && err.message || err).replace(/</g, '&lt;') + '</div>';
  }
})();
</script>
