 to Kenrokuen (~2.2 km, 25–30 min). No tourist bus runs this early: the Loop Bus starts ~8:30 and the Kenrokuen Shuttle ~9:30. Taxi if it\u0027s raining |\r\n| 8:15 AM | **Kenrokuen, shrines and the castle**, all walkable. Suggested order:\u003cbr\u003e1. **Kenrokuen Garden** (8:00 AM–5:00 PM, ¥320): one of Japan\u0027s three great gardens, with **yukitsuri** ropes going up on the pines. ~1 hr\u003cbr\u003e2. **Kanazawa Shrine**, on the garden\u0027s edge (2 min)\u003cbr\u003e3. **Tea at Shigure-tei** inside the garden (opens 9:00; matcha and wagashi, ~¥730). ~20 min\u003cbr\u003e4. Out the **Mayumizaka Gate** to **Ishiura Shrine** across the street: a tunnel of red torii. ~15 min\u003cbr\u003e5. Walk ~8 min round to the **Ishikawa Gate**\u003cbr\u003e6. **Kanazawa Castle Park**: free grounds, rebuilt turrets. ~1 hr\u003cbr\u003e7. **Ozaki Shrine** (good autumn leaves) on the Omicho side, then ~15 min walk to the market |\r\n| 11:00 AM | **Omicho lunch. Suggested: Kanazawa curry** at **Kanazawa Curry Laboratory** (27-2 Jikkenmachi, on the market\u0027s southwest edge). Build your own plate; go at 11:00 sharp, since a line builds by noon. Other options, including kaisendon, are in [Omicho lunch options](#omicho-lunch-options) below. Then browse the market stalls (see [Things to look for](#things-to-look-for-at-omicho)). Lines peak noon–2 PM, so 11:00 beats them |\r\n| 12:20 PM | Walk ~15–18 min (~1.2 km) past **Oyama Shrine** (the stained-glass gate) to **Nagamachi** |\r\n| 12:40 PM | **Nomura Samurai House** for its garden (8:30 AM–4:00 PM, ¥550), then the earthen-walled samurai lanes and canals. Everyone\u0027s first look (Dan kept Nov 4 light). **Optional snack:** a hot dog at **Street Vendor** (1-3-10-3 Nagamachi; 10:00 AM–5:00 PM, closed Thu), a small American-style stand selling \"Kanazawa-style Old School\" dogs. Lunch at Omicho was only ~1.5 hrs earlier, so maybe split one |\r\n| 1:50 PM | Walk ~20 min south, over the Sai River (Sai River Ohashi bridge) to Nomachi |\r\n| **2:30 PM** | **Myoryuji \"Ninja Temple\"** guided tour (~40 min, ¥1,200, **cash only**). **Booked by phone only.** Arrive 10–15 min early (the walk gets you there ~2:10). The tour is in Japanese with an English booklet |\r\n| 3:15 PM | **Teramachi** temple streets, starting next door to Myoryuji: **Kourinji** (the \"wish temple\": zodiac garden, Daruma wish balls) and **Houenji** (Maeda family temple with 4.5 m Nio guardian statues). ~30 min. Optional: matcha with gold leaf at the **Hoshoji temple café** (10:00 AM–4:00 PM, closed Tue), a few minutes away, if you\u0027re there before ~3:45 |\r\n| ~4:00 PM | **Craft Beer Bar Sink** (Nomachi, 2 min from Nishi Chaya): 7 counter seats, ~50 beers from around Japan. Fri **2:00 PM–1:00 AM** (closed Thu and Sat) |\r\n| **4:50 PM** | Step out to **Nishi Chaya** for sunset (~4:52 PM): the small, quiet geisha street, with lanterns coming on. ~20 min, then back to Sink for another round, or move on |\r\n| **6:10 PM** | Walk back over the Sai River into Katamachi: ~15 min straight to Kitama, or ~30 min with the detour to the **Korinbo Tree Fantasy** lights (skip it if you saw them Thursday) |\r\n| 6:45 PM | Dinner at **Kitama** (2-3-3 Katamachi), the casual ground floor of a ryotei founded in 1862: the **jibu-ni set** (duck stew, the Kaga classic). Confirm hours and last order when reserving |\r\n| 8:30 PM | Drinks in Katamachi, Kanazawa\u0027s main nightlife area. Beer picks: **TRI STAR Beer Restaurant** (~15 taps; check the pin) or tiny **CHE** off Shin-Tatemachi (Belgian imports, pricey; 3:00 PM–1:00 AM, closed Tue). Mugibatake if you skipped it Thursday |\r\n\r\n**If running behind:** shorten Nagamachi (Nomura House is the part to keep) so you reach Myoryuji by 2:20. Kenrokuen early and Myoryuji are the priorities.\r\n\r\n**If Sink is closed or full:** walk into Korinbo for **Futa\u0027s** or **Korinbo Jibiruba** before dinner (see Craft Beer in [city-ideas.md](../city-ideas.md)).\r\n\r\n## Omicho lunch options\r\n**Suggested: Kanazawa Curry Laboratory** (金沢カレー研究工房 近江町市場店), 27-2 Jikkenmachi, inside Omicho Market on its southwest edge ([Google Maps](https://maps.app.goo.gl/epQNdzvxeRLiWYpw7)). Its only Kanazawa branch, opened 2023; ~4.4–4.5 stars across several hundred reviews. Counter seats, and a line by the lunch rush, so be there at 11:00. **Hours: 10:00 AM–3:30 PM and 6:00–10:00 PM, closed Wednesdays.** Cards OK. How to order:\r\n1. **Curry:** **gold Kanazawa curry** (the classic thick roux, get this one), black keema with green chili, or red butter chicken. Spice level 1–10\r\n2. **Rice:** white, brown or turmeric. The curry is the same amount whatever the rice size, so the small size is enough\r\n3. **Toppings** (~¥150–550 each, 20+): for the classic Kanazawa plate get a **tonkatsu** (¥400), or the **Noto pork cutlet** (¥550, local pork). Lotus root and sweet potato are local autumn vegetables too\r\n\r\nDan has the classic version at Turban Curry on [Nov 4](./2026-11-04.md), so this is the modern take. If you also want seafood, snack from the stall grills afterward, or have seafood at Saturday\u0027s crab lunch in the same market.\r\n\r\n**Other options:**\r\n- **Champion Curry, Omicho branch** (カレーのチャンピオン近江町店), B1 of Omicho Ichiba-kan: the original Kanazawa-curry chain, fast counter food, no line usually. 11:00 AM–3:30 PM daily. Backup if the Lab\u0027s line is long\r\n\r\n*Kaisendon:*\r\n1. **Sensai Enishi (鮮彩えにし)**: run by one of the market\u0027s fish stalls. Get the signature **nodoguro hitsumabushi don**: blackthroat seaperch over rice, flecked with gold leaf. Eat it like Nagoya hitsumabushi, plain first, then with dashi poured over. Fri 11:00 AM–2:30 PM and 5:00–8:00 PM, closed Sundays\r\n2. **Inoya (井ノ弥)**: said to be where Omicho\u0027s kaisendon started. 40+ bowls, big portions, so all three can order different ones. Weekdays 10:00 AM–3:00 PM (weekends from 9:30). It\u0027s popular, and the line can start before it opens\r\n- **Fallbacks:** **Uouma (魚旨)**, kaisendon and nigiri, 11:00 AM–4:00 PM daily. **Morimori Sushi**, conveyor belt, 8:00 AM–4:00 PM, but expect a long wait unless you\u0027re in the ticket queue before ~10:45\r\n- **What to order:** **nodoguro**, **amaebi** and **gasu-ebi** (Kanazawa\u0027s shrimp, at its peak Sep–Nov; gasu-ebi rarely leaves the area), and buri (yellowtail) as winter starts\r\n\r\n## Things to look for at Omicho\r\n- **Snack while walking the aisles:** grilled scallops or oysters from the stall grills, **seafood croquettes**, and the free samples many fish stalls hand out\r\n- **Autumn local produce:** **Gorojima Kintoki** sweet potato and **Kaga lotus root** (look for them as croquettes or snacks), plus **kabura-zushi** (yellowtail pressed between turnip). Stalls start making kabura-zushi in November, so it\u0027s hit or miss\r\n- **Scout tomorrow\u0027s crab:** stop at **Kawaki Shoten** (9:00 AM–3:00 PM) and ask what they\u0027ll have Saturday and when it\u0027ll be out, so the Nov 7 lunch goes quickly\r\n- **Small souvenirs that travel well:** **Kaga bocha** (roasted-stalk tea, light and cheap), **jiro-ame** (the traditional malt-syrup candy; also as soft serve), Kanazawa sweets, and dried or packaged seafood snacks. Skip raw or fresh seafood: it won\u0027t last, and US customs won\u0027t let it in\r\n- **Ichihime Shrine**: a tiny shrine tucked inside the market\r\n- **Bring cash.** Many stalls don\u0027t take cards. Lots of stalls close on Wednesdays, but Friday is a normal day\r\n\r\n**Jibu-ni backup:** **Genzaemon** (Katamachi, izakaya with kamo jibu-ni and ~30 local sakes; 5:00–11:00 PM, closed Mon). Splurge option: **Zeniya** (Katamachi, refined Kaga cuisine, 5:30–10:00 PM, closed Sun, reserve; cancellation needs 7 business days\u0027 notice). Some places use chicken instead of duck, so ask.\r\n\r\n\r\n## Travel\r\n- All on foot, starting with the ~25–30 min walk to Kenrokuen. The **Kanazawa Loop Bus** (from ~8:30) and the **Kenrokuen Shuttle** (from ~9:30) start too late for the 8:00 opening. Hokutetsu city buses don\u0027t take Suica, so bring coins. Wear comfortable shoes: it\u0027s ~6–7 km of walking\r\n\r\n## Lodging\r\n- **Hotel Livemax Kanazawaekimae** (booked)\r\n- Night 3 of 3. Check-out is Sat Nov 7\r\n\r\n## TODO\r\n- [ ] **Book Myoryuji** for 3 at **2:30 PM** (3:00 is the latest backup; the temple is open 9:00 AM–4:00 PM). **Phone only**: no online or email booking (sites selling \"tickets\" are packaged tours). +81-76-241-0888; staff can take the booking in English. Ways to do it without a phone in Japan:\r\n  1. **Best: call before the trip** from the US using an internet calling app that dials landlines (e.g. Google Voice, cents per minute). The line is open 8:30 AM–5:00 PM Japan time (official site), which is **6:30 PM–3:00 AM Central** while daylight time lasts (until Nov 1)\r\n  2. **Ask a hotel front desk to call**: Takayama Washington Hotel on Nov 2–3, or Livemax Kanazawa at check-in Nov 4. Later means a higher risk that 2:30 PM is gone\r\n  3. **In person, Wed Nov 4 (~2:15 PM, already in the [Nov 4 plan](./2026-11-04.md))**: book at the intercom by the temple entrance (on the left). The temple closes at 4:00 PM. Same-day walk-ins only work if there\u0027s space\r\n- [ ] **Reserve Kitama** for 3 at ~6:45 PM, and check they serve duck (not chicken) jibu-ni\r\n- [x] Decided (Oct 19): one area per day. Fri = center + south on foot; Higashi Chaya moves to Sat morning. Skip the Fukumitsuya tour and the 21st Century Museum. Dinner is jibu-ni\r\n- [x] Kenrokuen: 8:00 AM–5:00 PM from Oct 16, ¥320\r\n- [x] Verified Oct 20: hours from Google Maps or official sites. No bus before ~8:30 (walk instead); sunset ~4:52, so Sink first and Nishi Chaya at sunset; Omicho → Nagamachi is 15–18 min. Kitama has no hours on Google: confirm when reserving\r\n\r\n**Sources:** [Myoryuji booking guide (One Day Away)](https://onedayawaytravel.com/ninja-temple-kanazawa/) · [Myoryuji (Visit Kanazawa)](https://visitkanazawa.jp/en/attractions/detail_50022.html) · [Myoryuji (Tripadvisor reviews: hotel booking, intercom)](https://www.tripadvisor.com/Attraction_Review-g298115-d1153431-Reviews-Myoryuji_Ninja_Temple-Kanazawa_Ishikawa_Prefecture_Hokuriku_Chubu.html) · [Jibuni in Kanazawa (Kansai Odyssey)](https://kansai-odyssey.com/jibuni-kanazawa-soul-food/) · [Omicho kaisendon shops (NTA Tripa)](https://www.nta.co.jp/media/tripa/articles/vUwpy) · [Omicho food guide (Japan Uncharted)](https://japanuncharted.com/ishikawa/market/kanazawa-omicho-market-food-guide) · [Omicho etiquette and timing (Tabimania)](https://tabimaniajapan.com/culture/food-culture/how-to-enjoy-kanazawas-omicho-market-seafood-bowls-street-food-etiquette) · [Kanazawa Curry Laboratory (official)](https://kanazawa-curry-lab.com) · [Shigure-tei (official)](https://shiro-niwa.pref.ishikawa.lg.jp/kenrokuen-garden/e/sigure.html) · [Sunset, Nov 2026 (NAOJ)](https://eco.mtk.nao.ac.jp/koyomi/dni/2026/s1711.html.en) · [Kanazawa tourist buses](https://www.kanazawastation.com/kanazawa-tourist-bus-services/)\r\n"},{"id":"2026-11-07","md":"# Day 12 — Sat Nov 7 — Kanazawa → Tokyo (Higashi Chaya, crab lunch at Omicho)\r\n\r\nFirst day local crab is in shops (the first auction was ~7:30 PM last night, Nov 6; rough weather can delay the season opening by a few days, as in 2023). Crab lunch, then an early-afternoon Shinkansen to Tokyo.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 8:30 AM | Breakfast, pack |\r\n| 9:15 AM | Check out. Put bags in station lockers, or ask the hotel to hold them |\r\n| 9:30 AM | Bus (~10 min, to Hashiba-cho) or taxi to **Higashi Chaya District**. Walk the teahouse streets while they\u0027re still quiet, and look in the gold-leaf shops. Step inside **Shima** (an Edo-era geisha house, 9:30 AM–5:30 PM, ¥500). **Try the sweets here:** order the matcha with a seasonal **wagashi** (Kanazawa is one of Japan\u0027s big wagashi towns; city-ideas suggests this over the gold-leaf soft serve) |\r\n| ~10:15 AM | **Sake-lees soft serve at Fukumitsuya Higashi** (1-14-9 Higashiyama, 10:00 AM–6:00 PM), the brewery\u0027s own shop in an old townhouse. ~15 min. No sake flight this early |\r\n| 10:35 AM | Cross the Asano River (~5 min) to **Kazuemachi**: the quiet riverside geisha lanes (Akarizaka, Kuragarizaka) |\r\n| 10:50 AM | Walk ~15 min to Omicho. (Skipping Oriental Brewing Higashiyama: it opens at 11:00 and would push the crab lunch late. The same brewery\u0027s beer is at the station taproom before the train) |\r\n| 11:05 AM | **Crab lunch** on **opening day for local crab**: **Kawaki Shoten** (9:00 AM–3:00 PM; boils crab on site) for **kobako gani** (female, with roe) and **kano gani** (male, blue tag), or a kaisendon topped with kobako. The best stalls sell out, so don\u0027t come later than this. Grab ekiben or snacks for the train while you\u0027re here |\r\n| 12:30 PM | Walk ~15 min back to the station, grab bags. Or a last pint at **Oriental Brewing Kanazawa Station** (inside the station, 2F, 11:00 AM–10:00 PM) |\r\n| **1:50 PM** | **Kagayaki 534** Kanazawa → Tokyo (~2.5 hrs, all seats reserved) |\r\n| 4:20 PM | Arrive Tokyo Station (confirmed timetable: Ueno 4:14, Tokyo 4:20). JR to Ryogoku, check in |\r\n| ~6:30 PM | **Tori-no-Ichi** fair at **Ootori Shrine** (Senzoku, north of Asakusa). Sobu Line to Akihabara, then Hibiya Line to Iriya (~25–30 min). Runs until midnight, busiest ~7–11 PM. **Dinner: no reservation.** Eat at the fair\u0027s food stalls, or grab something quick near the hotel or on the way first, then head up |\r\n\r\n**Want to make something?** A **gold-leaf workshop** in Higashi Chaya (~1 hr): **HAKUICHI** or **Kinpakuya Sakuda** (both shops 9:00 AM–5:00 PM; check workshop times and booking when you plan it). It replaces Kazuemachi and pushes the crab lunch to ~11:30. See the gold-leaf entry in [city-ideas.md](../city-ideas.md).\r\n\r\n**Decided: afternoon train.** (Skipped: the **Kanazawa Castle + Kenrokuen light-up** is on tonight, but the last Tokyo-bound train is Kagayaki 518 at 9:03 PM, which would put us in Ryogoku around midnight.)\r\n\r\n**Decided (Oct 24): the evening is Tori-no-Ichi, with no dinner reservation.** Tonight is the first Tori-no-Ichi of the year (the rooster-day fair). We\u0027ll eat at the fair stalls, or find food first and then go. The chanko at Tomoegata is dropped; Ryogoku chanko can fit another night if we want it. See Festivals/Events under Tokyo in [city-ideas.md](../city-ideas.md).\r\n\r\n## Travel\r\n- Hokuriku Shinkansen Kanazawa → Tokyo: **Kagayaki 534, 1:50 PM** (~2.5 hrs). It\u0027s flagged as \"may not run every day,\" so confirm it runs Sat Nov 7 when booking. Backups: **Hakutaka 564 at 12:58 PM** or **Hakutaka 566 at 1:58 PM** (slower, ~3 hrs). Saturday in foliage season, so reserve 3 seats together\r\n- Tokyo Station → hotel: JR Chuo-Sobu local from Akihabara to Ryogoku (~15–20 min total), or JR Sobu Rapid to Kinshicho and walk\r\n\r\n## Lodging\r\n- Check out: **Hotel Livemax Kanazawaekimae**\r\n- Check in: **APA Hotel \u0026 Resort Ryogoku Eki Tower** (booked) — 1-11-10 Yokoami, Sumida, Tokyo 130-0015. Check-in from 3:00 PM\r\n- Night 1 of 4\r\n\r\n## TODO\r\n- [x] Tokyo end-block lodging booked: APA Hotel \u0026 Resort Ryogoku Eki Tower (Nov 7–11)\r\n- [ ] **Reserve 3 seats together on Kagayaki 534** (1:50 PM → Tokyo 4:20) now: the Nov 7 booking window is open, so a search on e5489/Eki-net shows whether it runs. Fall back to Hakutaka 564/566\r\n- [x] Decided (Oct 24): no dinner reservation. Eat at Tori-no-Ichi or grab food on the way\r\n- [x] Decided: afternoon train, skipping the light-up\r\n- [x] **Fukumitsuya Higashi** opens 10:00 (Google Maps). Decided (Oct 20): soft serve only, no sake flight in the morning\r\n- [ ] Optional: book a gold-leaf workshop (see above)\r\n- [x] Decided (Oct 19): Saturday morning is the east side (Higashi Chaya, Kazuemachi), then the crab lunch. Nagamachi moved to Fri Nov 6\r\n\r\n**Sources:** [Kanazawa Station Shinkansen timetable (JR West)](https://timetable.jr-odekake.net/station-timetable/2663006001) · [Kagayaki 534 (JR East)](https://timetables.jreast.co.jp/en/2608/train/130/130071.html) · [Crab season first auction (tabi-mag)](https://tabi-mag.jp/kanione-himeone/)\r\n"},{"id":"2026-11-08","md":"# Day 13 — Sun Nov 8 — Tokyo (Ryogoku and Kameido, Hop Fest in Daikanyama, Ebisu late)\r\n\r\n**Draft (Oct 24).** Easy day near the hotel with no museums: a garden, a river walk, brunch at Edo Noren by the sumo ring, sumo and 47 Ronin history, then the chrysanthemum festival and gyoza in Kameido. A rest at the hotel, then across town in the evening to the **Craft Beer Japan Hop Fest** at Spring Valley Brewery in Daikanyama (18:00 session), and late bites in Ebisu next door. Replaces the Oct 23 west-side draft (see \"Moved off today\" below). Hours are from Google Maps unless marked.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 9:30 AM | Slow start at the hotel |\r\n| 10:00 AM | **Kyu-Yasuda Garden** (9:00–18:00, free), ~3 min from the hotel. Small Edo-era stroll garden around a pond that used to fill with the Sumida River\u0027s tides. ~30 min |\r\n| 10:30 AM | **Sumida River walk** on the riverside terrace by Ryogoku Bridge. Loop back past the **Kokugikan** (sumo hall, outside only) and the sumo-town streets |\r\n| 11:15 AM | **Brunch at Ryogoku Edo Noren** (10:00–23:00), the food hall inside the old 1929 Ryogoku station building, built around a full-size sumo ring. About a dozen Edo-style counters: sushi, tempura, soba, monja, chanko. Each counter keeps its own hours (not checked) |\r\n| 12:30 PM | Walk ~10 min to **Ekoin Temple** (9:00–16:30): sumo tournaments were held here before the Kokugikan was built, and the grounds have sumo memorial stones. Then 3 min on to the **Kira residence site** (Honjo Matsuzakacho Park, always open), the small walled park where the 47 Ronin took their revenge in 1703 |\r\n| 1:30 PM | JR Sobu Line 2 stops to Kameido. **Kameido Tenjin Shrine** (always open): the **chrysanthemum festival** (free, through Nov 23), the turtle pond and arched bridges with Skytree behind |\r\n| 2:30 PM | **Kameido Gyoza**: one dish only, plates of small crispy gyoza, with a beer. The **Ryogoku branch** (4-34-10 Ryogoku; Sun 11:00–21:00) is the sure option, since the main shop\u0027s closing day is disputed |\r\n| 3:15 PM | Back to the hotel to rest |\r\n| 4:45 PM | Sobu Line to Akihabara, Hibiya Line to **Ebisu** (~40 min), walk ~7 min to **Daikanyama** |\r\n| **6:00 PM** | **Hop Fest, evening session (18:00–20:30)** at **Spring Valley Brewery Tokyo**, Log Road Daikanyama. Up to 20 beers from 18 Japanese breweries, including SVB\u0027s fresh-hop **IBUKI** (out Nov 7), sushi and rolls made on site, and the **Kitamura Sisters** playing Tsugaru shamisen this session. Last orders ~8:00 |\r\n| 8:30 PM | Walk to Ebisu: **Ebisu Yokocho** (~20 izakaya stalls under one roof, most open late) or **AFURI Ebisu** yuzu-shio ramen (to 5 AM) |\r\n| ~10:00 PM | Back to Ryogoku: Hibiya Line Ebisu → Akihabara, then Sobu Line (~40 min). Last trains are around midnight |\r\n\r\n**Optional, instead of the hotel break:** **Bathe Yotsume Brewery** near Oshiage (weekends from 15:00) for a beer before Hop Fest.\r\n\r\n**Not today:** the **Sumo Museum** in the Kokugikan is closed on weekends. No sumo morning practice in Ryogoku either: the November tournament should open today in Fukuoka (it starts on the 2nd Sunday; not checked), so the stables will be there. The Edo-Tokyo Museum\u0027s \"Toyotomi Brothers!\" show (last day today) and the Sumida Hokusai Museum were dropped.\r\n\r\n**Hop Fest tickets:** advance **¥3,800** on e+ (admission, a 5-piece sushi set, and four ¥500 vouchers, each good for a 200 ml beer or food), or **¥2,500 at the door** (admission and the four vouchers, no sushi). ~130 advance tickets per session, no cancellations or changes, and door sales can be cut if advance sells out. Payment method at the venue not stated. Seating is free, first come, first served ([bestcalendar](https://bestcalendar.jp/press/159060) · [e+](https://eplus.jp/sf/venue/1504240)).\r\n\r\n**Earlier option:** the **14:30–17:00 session** works too. Skip Kameido and leave Ryogoku at ~1:30, then dinner in Ebisu at a normal hour, with the Yebisu Brewery taproom (weekends to 19:00, last entry 18:30) in between.\r\n\r\n**Moved off today:** Adam\u0027s **Udon Shin**, **Kanoya**, **Shimokitazawa** (Senrogai food trucks) and **Beer Boy** (Shibuya Parco) were on the Oct 23 draft. They need a new day, maybe Tue Nov 10. Udon Shin is open daily and Beer Boy is open to 11:30 PM.\r\n\r\n## Travel\r\n- Morning: on foot around Ryogoku\r\n- Ryogoku → Kameido: JR Sobu Line, 2 stops\r\n- Ryogoku → Ebisu: JR Sobu Line to Akihabara, Hibiya Line to Ebisu (~40 min), then walk ~7 min to Daikanyama\r\n- Ebisu → Ryogoku: Hibiya Line to Akihabara + Sobu Line (~40 min)\r\n\r\n## Lodging\r\n- **APA Hotel \u0026 Resort Ryogoku Eki Tower** (booked) — 1-11-10 Yokoami, Sumida, Tokyo 130-0015\r\n- Night 2 of 4\r\n\r\n## TODO\r\n- [ ] Confirm the plan with Jeff and Adam\r\n- [ ] **Buy Hop Fest advance tickets** for 3, Sun Nov 8, 18:00 session, on e+ (¥3,800, no refunds)\r\n- [ ] Find a new day for Udon Shin, Kanoya and Shimokitazawa (Beer Boy moved to Fri Oct 30)\r\n"},{"id":"2026-11-09","md":"# Day 14 — Mon Nov 9 — Tokyo (Mt. Tsukuba day trip)\r\n\r\n**Draft.** Mt. Tsukuba replaces Nikko as the second day trip (Nikko is too far). A weekday was picked on purpose, because fall weekends on the mountain are crowded.\r\n\r\n## Travel\r\n- Hotel → **Akihabara**: walk ~5 min to JR Ryogoku, then the Chuo-Sobu local two stops (~5 min)\r\n- **Tsukuba Express (TX) Rapid**, Akihabara → **Tsukuba**: ~45 min, ~¥1,200–1,280 one-way\r\n- **Mt. Tsukuba Shuttle Bus** (Kanto Tetsudo), from bus stop 1 at **Tsukuba Center** (outside Tsukuba Station) to **Tsukubasan-jinja-iriguchi** (Tsukuba Shrine Entrance): ~38 min, ¥770. The bus continues to Tsutsujigaoka (¥930)\r\n- Weekday buses, Apr/May/Oct/Nov timetable ([Kanto Tetsudo PDF](https://www.kantetsu.co.jp/cms/wp-content/themes/kr/pdf/bus/timetable_files/tk/bu_tourist_02-time.pdf), revised Oct 25, 2025):\r\n  - **Tsukuba Center → Shrine Entrance:** 8:00→8:38, **8:50→9:28**, 9:40→10:18, 10:20→10:58, 11:00→11:38, 11:50→12:28, 1:30→2:08, 2:15→2:53, 3:00→3:38 PM\r\n  - **Shrine Entrance → Tsukuba Center (~40 min):** 9:20, 10:10, 11:05, 12:40, 1:25, 2:10, **2:55, 3:40**, 4:25, 5:15 PM\r\n- **Last weekday bus back** from the Shrine Entrance is **5:15 PM** (arrives Tsukuba Center 5:55). Don\u0027t miss it\r\n- **Pay with the IC card (Suica/PASMO)**, no special ticket. TX and the shuttle bus both take IC (on the bus, tap when you get off). The plan is to hike both ways, maybe taking the cable car down if feeling lazy, so IC is just easier. Load **¥5,000+** before leaving\r\n  - Rough IC cost: TX ~¥1,280 × 2 + bus ¥770 × 2 ≈ **¥4,100** hiking both ways. Add a one-way cable car (~¥700, not confirmed) if riding down ≈ ¥4,800\r\n  - Skipped: the **Mt. Tsukuba Ticket (筑波山きっぷ)**, ¥4,670 from Akihabara (confirmed on the TX site, Oct 2026). It covers TX + bus round trips + unlimited cable car/ropeway, so it only pays off if you ride the cable car or ropeway both ways\r\n\r\n## Lodging\r\n- **APA Hotel \u0026 Resort Ryogoku Eki Tower** (booked) — 1-11-10 Yokoami, Sumida, Tokyo 130-0015\r\n- Night 3 of 4\r\n\r\n## Plan\r\nAll times are rough. The mountain has twin peaks, **Nantai-san** (871 m) and **Nyotai-san** (877 m, the higher one with the better view). They\u0027re joined by a short ridge with **Miyukigahara** and its teahouses in the middle. The plan is to hike up one trail and down another, with no cable car needed.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 7:30 AM | Leave the hotel (JR Ryogoku → Akihabara, 2 stops). Grab konbini breakfast and **onigiri/snacks for the trail** as a lunch backup |\r\n| ~7:50 AM | At Akihabara, tap in with the IC card and take the **TX Rapid** to Tsukuba |\r\n| ~8:35 AM | Arrive at Tsukuba. Last real toilet and konbini stop |\r\n| 8:50 AM | **Shuttle bus** to Tsukubasan-jinja-iriguchi |\r\n| ~9:30 AM | Walk up (~10 min) to **Tsukubasan Shrine**. The mountain itself is the object of worship, so the shrine sits at the base. Its maples and ginkgos peak mid-to-late Nov, so they\u0027ll be partly turned |\r\n| ~9:50 AM | **Hike up the Miyukigahara Course**: ~2 km, ~610 m of gain, ~1.5 hrs. Steep and steady, mostly stone steps and roots through cedar forest, running alongside the cable car tracks. Maples on the middle slopes |\r\n| ~11:20 AM | Reach **Miyukigahara**, the saddle between the peaks |\r\n| 11:30 AM | Side trip to the **Nantai-san summit** (~15 min each way): a small shrine at the top and a **beech forest** that turns gold in early Nov. The Nature Research Trail loops around this peak if you want a longer detour |\r\n| ~12:00 PM | **Lunch at the Miyukigahara teahouses** (most are 10:00–15:00). Get **Tsukuba udon**, the local udon with pork and Ibaraki vegetables. Weekday hours can be irregular, which is why you\u0027re carrying the konbini backup |\r\n| ~12:45 PM | Walk the ridge to **Nyotai-san** (~20 min). The rocky summit has the **best view on the mountain**: the Kanto Plain, Lake Kasumigaura, and Tokyo/Skytree and Fuji on a clear day |\r\n| ~1:20 PM | **Hike down the Shirakumobashi Course** back to the shrine (~1.5 hrs). The top section passes the famous **giant rocks**: **Benkei Nanamodori** (a boulder balanced overhead that Benkei supposedly hesitated under seven times), **Mother\u0027s Womb Rock**, and others. Then a long quiet forest descent |\r\n| ~2:50 PM | Back at the shrine. Optional snack or souvenir stop on the shrine approach |\r\n| 2:55 or 3:40 PM | Bus from the **Shrine Entrance** back to Tsukuba Center (~40 min). 2:55 is tight; 3:40 is the realistic one. Later buses at 4:25 and **5:15 (last)** |\r\n| ~4:00 PM | TX Rapid back to Akihabara (~45 min) |\r\n| ~5:00 PM | Back in Tokyo. Shower, then dinner near the hotel |\r\n\r\n**Onsen option (instead of hiking down):** after Nyotai-san, walk back to Miyukigahara and take the **cable car** down (~8 min, pay with IC or cash). That puts you at the shrine by ~1:45, in time for a day-use bath at the foot of the mountain. Both baths are near the shrine:\r\n- **Tsukubasan Edoya**: 390+ year-old inn, ~5 min walk from the shrine. Entry 11:30, last reception **2:00 PM**, out by 3:00. ¥1,540, hand towel included\r\n- **Tsukubasan Hotel Aokiya**: rooftop open-air bath with views out to Skytree and Fuji on a clear day. **12:00–3:00 PM**, ¥1,200\r\n\r\n**Easier version:** take the cable car up and hike down Shirakumobashi. That keeps the rocks and the views and skips the steep climb.\r\n\r\n**If running late:** drop the Nantai-san side trip, since Nyotai-san is the better summit. If it\u0027s past ~1:30 when you leave Nyotai, take the cable car or ropeway down instead of hiking.\r\n\r\n**Weather call:** the view is the payoff. If Monday looks hazy or rainy and Tue Nov 10 looks clear, swap the two days.\r\n\r\n## Foliage on Nov 9\r\nColor moves down the mountain. Expect the **summit and upper slopes in color** (beech gold, some red maples), the **middle slopes and cable car line around peak**, and the **shrine area still a week or two early** (it peaks mid-to-late Nov). The **Momiji Festival\u0027s night cable car and maple light-up** (5–8 PM) runs **weekends and holidays only**, so you won\u0027t see it on a Monday.\r\n\r\n## Foods to try\r\n| Food | What it is | Where |\r\n|---|---|---|\r\n| **Tsukuba udon** | Local udon with pork and Ibaraki vegetables | Miyukigahara teahouses (Sekirei Chaya, Naka no Chaya, Meoto Chaya, Miyuki Chaya, Mitsura-tei), ~10:00–15:00 |\r\n| **Konbini lunch** | Backup in case the teahouses are closed on a weekday | Buy at Akihabara or Tsukuba Station before the bus |\r\n\r\n## TODO\r\n- [ ] Check the forecast the weekend before. Swap with Tue Nov 10 if Tuesday looks clearer\r\n- [x] Weekday shuttle bus timetable confirmed on Kanto Tetsudo\u0027s PDF (Nov schedule): last bus back 5:15 PM\r\n- [x] Ticket decision: pay with IC instead of the Mt. Tsukuba Ticket (¥4,670 confirmed, but only worth it with cable car both ways)\r\n- [ ] Top up the IC card to ¥5,000+ before the day\r\n- [ ] Hiking prep: shoes with grip (stone steps and roots, slick when wet), water, layers. Summit is ~850 m above the base and can be windy\r\n- [ ] Leave big bags at the hotel\r\n- [ ] Hike down vs. cable car (+ onsen): plan is hike both ways, decide on the day\r\n- [ ] Dinner back in Tokyo: not picked yet\r\n\r\n**Sources:** [Mt. Tsukuba Ticket (TX)](https://www.mir.co.jp/en/ticket/discount/tsukuba.html) · [TX travel time/fare](https://www.japan-experience.com/plan-your-trip/travel-by-train/tsukuba/train-in-japan/tsukuba-express-tx) · [Shuttle bus timetable PDF (Kanto Tetsudo)](https://www.kantetsu.co.jp/cms/wp-content/themes/kr/pdf/bus/timetable_files/tk/bu_tourist_02-time.pdf) · [Kanto Tetsudo timetable](https://www.kantetsu.co.jp/bus/timetable/tsukuba) · [Cable car \u0026 ropeway hours/fares](https://nihontravelguide.com/mount-tsukuba-ibaraki/) · [Trail guide](https://www.gltjp.com/en/article/item/21172/) · [Autumn foliage + Momiji Festival](https://matcha-jp.com/en/22139) · [Night operation, weekends/holidays](https://travel.iconia.co.jp/2026autumn/2026autumn-dest/tsukuba/) · [Summit teahouses](https://ttca.jp/%E7%AD%91%E6%B3%A2%E5%B1%B1%E9%A0%82%E3%81%AE%E3%80%8C%E5%B1%B1%E3%82%B0%E3%83%AB%E3%83%A1%E3%80%8D%EF%BD%9Emt-tsukuba%E3%80%80yama%E3%80%80gourmet%EF%BD%9E/) · [Edoya day-use bath](https://tsukubasan.co.jp/dayuse/) · [Aokiya day-use bath](https://rurubu.jp/andmore/spot/80006152)\r\n"},{"id":"2026-11-10","md":"# Day 15 — Tue Nov 10 — Tokyo (Chuo Line: Nakano, Koenji, Kichijoji)\r\n\r\n**Draft (Oct 24, replaces the Oct 23 draft; morning added Oct 25).** A slow day after the Tsukuba hike, all on the JR Chuo Line. The morning has stops on the way out: **Koishikawa Korakuen** garden and **Kagurazaka** at Iidabashi, then an hour of carp fishing in the old castle moat at the **Ichigaya Fish Center**. Then **Nogata Hope** ramen for lunch in Nakano (Adam\u0027s pick), **Nakano Broadway** for retro games, an afternoon of Koenji thrift shops, then **Inokashira Park** in Kichijoji before sunset. Evening in Kichijoji\u0027s **Harmonica Yokocho** (the Omoide Yokocho match), and **Akiyoshi** yakitori in Nakano (Adam\u0027s pick) on the way home. The Chuo-Sobu local runs straight from Ryogoku to every stop, so there are no transfers. Hours are from Google Maps unless marked.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 8:45 AM | Konbini or hotel breakfast |\r\n| 9:30 AM | JR Chuo-Sobu local from Ryogoku to **Iidabashi** (~15 min, no transfer) |\r\n| 9:45 AM | **Koishikawa Korakuen** (Tue 9 AM–4:30 PM), ~8 min walk from Iidabashi. One of Tokyo\u0027s oldest stroll gardens (begun in the 1600s): the red Engetsukyo moon bridge, ponds and the first autumn color. ~45 min |\r\n| 10:30 AM | Walk back past the station to **Kagurazaka**, the old geisha district: the cobbled back alleys off the main slope, and **Akagi Shrine** (Tue 9 AM–5 PM), Kengo Kuma\u0027s modern glass shrine near the top. Snack option: **Gojuban**\u0027s giant pork buns or **Kinozen**\u0027s matcha bavarois (Google gave no clear hours for either, so check on the day) |\r\n| ~10:50 AM | Walk ~15 min to **Ichigaya** along the old outer moat (or take the Chuo-Sobu local one stop) |\r\n| 11:00 AM | **Ichigaya Fish Center** 🎣 (weekdays 11 AM–7 PM, last entry 6 PM, may close early in rain; [official site](https://www.ichigaya-fc.com/hp2025/carp.html), Oct 25). Carp fishing in the castle moat right beside the tracks. **¥1,200 per adult per hour**, rod and bait included; extra bait ¥100; +30 min ¥600. Catch and release, no reservation, weekdays are quiet. Ichigaya Station exit 4. ~1 hr |\r\n| 12:10 PM | JR Chuo-Sobu local Ichigaya → **Nakano** (~15 min, no transfer) |\r\n| 12:30 PM | **Lunch: Nogata Hope Nakano branch** 🟢 (野方ホープ 中野店, 2-2-1 Arai; Tue 11 AM–1:30 AM, Google Maps). Walk up the **Nakano Sun Mall** arcade and through Broadway; it\u0027s ~2–3 min past Broadway\u0027s north end. Classic shoyu tonkotsu **元 (Gen) ¥950**; richer **濃 (Koku)** with seafood broth ¥980; **焦がし味噌** charred-miso tonkotsu (fall–winter limited) ¥1,080; everything-on **旨盛** ¥1,380. Tax included, [official menu](https://www.nogata-hope.com/menu), Oct 25. **Cash or PayPay only**. The original main shop (2-58-4 Nogata) is a ~25 min walk or ~5 min taxi away. Only worth it if Adam wants the original |\r\n| 1:15 PM | Back to **Nakano Broadway** (10 AM–8 PM). **Mandarake** opens at 12:00 (12–8 PM, daily): manga, figures, retro games and trading cards across ~25–35 small shops on floors 2–4. ~1.25 hrs |\r\n| 2:30 PM | JR Chuo Line Nakano → **Koenji** (1 stop, ~2 min), north exit. Then **Koenji**\u0027s north side: the **Kita-Kore Building** (11 AM–6 PM, wild secondhand fashion), the vintage and thrift shops on the north-side streets, and **Koenji Hikawa Shrine** (8 AM–5 PM; Japan\u0027s only shrine to the weather). Then under the tracks to the south side\u0027s **Pal** and **Look** arcades |\r\n| 3:45 PM | Chuo Line Koenji → **Kichijoji** (~10 min) |\r\n| 4:00 PM | **Inokashira Park** (south exit, ~5 min walk): the pond and early autumn color before sunset at ~4:40. Optional yakitori stop at **Iseya Koen Store** by the park (Tue 12–9 PM; the main Iseya Sohonten is **closed Tuesdays**) |\r\n| ~5:00 PM | **Harmonica Yokocho** at dusk: a tight grid of tiny bars and stalls by the north exit. Bar-hop until ~6:45. Snacks along the way: **Minmin** gyoza (Tue 11:30 AM–3 PM and 4–8:30 PM, closed Thursdays) and a menchi-katsu from **Satou** (10 AM–7:30 PM, so go early). Each bar keeps its own hours, and Google\u0027s 10 AM–8 PM for the alley as a whole is only rough. Craft beer option: **YONA YONA BEER WORKS Kichijoji** (Yo-Ho Brewing taproom, 11:30 AM–10 PM daily) |\r\n| 6:45 PM | Chuo-Sobu local back east to **Nakano** (~10 min) |\r\n| 7:00 PM | **Dinner: Akiyoshi Nakano** 🟢 (5-54-3 Nakano, Fujita Bldg 1F, 03-3385-0071; Tue 5–10:30 PM). Fukui-style yakitori, ~5 min from the station. Last order not checked |\r\n| ~9:00 PM | Optional nightcap at **Nakano Beer Kobo**, a small brewpub near Nakano Station (Tue 5–11 PM, closed Mondays) |\r\n| ~9:30–10:00 PM | Chuo-Sobu local straight back to Ryogoku (~35 min) |\r\n\r\n**Left out:** the **Kosugi-yu** sento in Koenji (skipped Oct 25), Kichijoji\u0027s **Beer Boy** (Google Maps has no listing for it, so it may have closed; the Shibuya branch is on [Oct 30](./2026-10-30.md)) and the **Ghibli Museum** (closed Nov 4–18 and every Tuesday). Other morning options looked at on Oct 25: the **Edo-Tokyo Museum** or the **Sumida Hokusai Museum** by the hotel (both Tue 9:30 AM–5:30 PM, closed Mondays), or **Ochanomizu**\u0027s **Yushima Seido** (Tue 9:30 AM–5 PM) and **Kanda Myojin** (Tue 9 AM–4 PM) as a backup for the Iidabashi stop. Shimokitazawa, Udon Shin and Kanoya would suit Jeff and Adam on Mon Nov 9 while Dan is on Mt. Tsukuba.\r\n\r\n## Travel\r\n- Ryogoku → Iidabashi: JR Chuo-Sobu local, direct (~15 min). Iidabashi → Ichigaya: ~15 min walk along the moat, or 1 stop. Ichigaya → Nakano: Chuo-Sobu local, direct (~15 min)\r\n- Nakano Station → Nogata Hope Nakano branch: up the Sun Mall and through Broadway, ~2–3 min past its north end. Then Nakano → Koenji: JR Chuo Line, 1 stop (~2 min)\r\n- Koenji → Kichijoji → Nakano: Chuo Line, ~10 min each way\r\n- Nakano → Ryogoku: JR Chuo-Sobu local, direct (~35 min). Last trains are around midnight\r\n\r\n## Lodging\r\n- **APA Hotel \u0026 Resort Ryogoku Eki Tower** (booked) — 1-11-10 Yokoami, Sumida, Tokyo 130-0015\r\n- Night 4 of 4\r\n\r\n## TODO\r\n- [ ] Confirm the plan with Jeff and Adam\r\n- [ ] Akiyoshi Nakano: ask the hotel to phone ahead for 3 at ~7:00 PM, or walk in (booking rule not checked)\r\n- [ ] Bring cash: Ichigaya Fish Center (the site doesn\u0027t say if cards work), Nogata Hope (cash or PayPay), Harmonica Yokocho bars\r\n- [ ] If it\u0027s raining, skip the Fish Center (it may close early) and spend the time at Korakuen or Kagurazaka\r\n- [ ] Swap with Nov 9 if the weather is better for Tsukuba today. On a Monday, Iseya Koen Store and Nakano Beer Kobo are closed\r\n\r\n**Sources:** hours from Google Maps (Oct 25) for Koishikawa Korakuen, Akagi Shrine, Edo-Tokyo Museum, Sumida Hokusai Museum, Yushima Seido and Kanda Myojin. Ichigaya Fish Center hours and prices from its [official site](https://www.ichigaya-fc.com/hp2025/carp.html) (Oct 25). Hours from Google Maps (Oct 24) for Nakano Broadway, Mandarake Nakano, Nogata Hope Nakano branch (Oct 25), Kita-Kore Building, Koenji Hikawa Shrine, Minmin, Satou, YONA YONA BEER WORKS Kichijoji, Iseya, Akiyoshi Nakano and Nakano Beer Kobo. Background in [tokyo-neighborhoods.md](../tokyo-neighborhoods.md).\r\n"},{"id":"2026-11-11","md":"# Day 16 — Wed Nov 11 — Tokyo (departure)\r\n\r\n**Draft (Oct 23, updated Oct 24).** Stay near the hotel and the airport line: coffee in Kiyosumi-Shirakawa or a wander in Kuramae, a last bowl at **Yuzu Lab Noodles** (bookends the trip, since it was the first full-day dinner on Oct 28), then the Asakusa Line to Haneda.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 9:30 AM | Pack and check out (before 10:00). Leave bags at the APA front desk |\r\n| 10:00 AM | Oedo Line 2 stops to **Kiyosumi-Shirakawa**: **Blue Bottle** or **Allpress**, then **Kiyosumi Garden** |\r\n| 11:20 AM | Oedo Line back to Ryogoku, then JR Sobu Line 2 stops to **Akihabara** (~20 min), ~5 min walk to Kanda Sudacho |\r\n| 11:45 AM | **Last meal: Yuzu Lab Noodles** (2-8 Kanda Sudacho, CHACHA Bldg 1F; Wed 11:00–22:00, Google Maps). Get there before the noon lunch rush |\r\n| 12:45 PM | JR Sobu Line 2 stops back to Ryogoku. The spare time covers a queue at Yuzu Lab |\r\n| 1:45 PM | Grab bags. JR Sobu Line one stop to Asakusabashi, then the Toei Asakusa Line through onto Keikyu to **HND Terminal 3** (~45–50 min) |\r\n| ~2:45 PM | At Haneda, ~2.5 hrs before the flight |\r\n| **5:15 PM** | **Delta 120** HND → MSP |\r\n\r\n**Kuramae instead of Kiyosumi:** Dandelion Chocolate and the Kakimori notebook shop, 1 stop on the Oedo Line. Kuramae Station is also on the Asakusa Line, but the bags are back at the hotel either way.\r\n\r\n## Travel\r\n- Delta 120: departs HND 5:15 PM → arrives MSP 1:23 PM the same day (booked)\r\n- Route to HND: JR Sobu Line Ryogoku → Asakusabashi (1 stop), then the Toei Asakusa Line, which runs through onto Keikyu straight to Haneda (~45–50 min total, roughly ¥600). Alternatively, walk ~13 min to Kuramae and board the Asakusa Line there with no JR leg. Exact route not confirmed yet. Not every Asakusa Line train goes through to Haneda, so check the destination board\r\n\r\n## Lodging\r\n- Check out: **APA Hotel \u0026 Resort Ryogoku Eki Tower**, before 10:00 AM. Ask the front desk to hold bags until you leave for the airport\r\n- Most of the day is free before the flight\r\n\r\n## TODO\r\n- [ ] Confirm the APA will hold bags on checkout day\r\n- [ ] Confirm the train route to HND\r\n"}],"places":[{"Name":"Hoppy Street","Location":"Hoppy Street, Asakusa, Taito, Tokyo, Japan","City":"Tokyo","Type":"Food","Notes":"Oct 28 lunch. Open-air izakaya with nikomi stew and beer. Tempura is the other lunch idea","layer":"alcohol-and-bars"},{"Name":"Hitachino Brewing Lab","Location":"Hitachino Brewing Lab, 1-25-4 Kanda Sudacho, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Oct 28 around 4:20 PM. Kiuchi Brewery taproom in mAAch ecute under the old brick rail arches. Daily 11 AM-10 PM (Sun to 9 PM)","layer":"alcohol-and-bars"},{"Name":"Omoide Yokocho","Location":"Omoide Yokocho, Shinjuku, Tokyo, Japan","City":"Tokyo","Type":"Food","Notes":"Oct 30 dinner about 6:20 PM. Yakitori and beer. Friday stalls seat 6-10 and fill by 7. Bring cash","layer":"alcohol-and-bars"},{"Name":"Golden Gai","Location":"Golden Gai, Shinjuku, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Oct 30 drinks about 8:45 PM, 3 min from Kabukicho Tower. Many bars are cash only and some charge a cover","layer":"alcohol-and-bars"},{"Name":"The Deep","Location":"The Deep, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Tiny jazz and soul bar with a grand piano and live singers. Quieter than Golden Gai. Neighborhood not given in the notes. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Monzen-Nakacho drinking alleys","Location":"Monzen-Nakacho, Koto, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Standing bars and izakaya on the shrine approach. Try Fukagawa-meshi (clam rice)","layer":"alcohol-and-bars"},{"Name":"Nui. Hostel \u0026 Bar Lounge","Location":"Nui. Hostel \u0026 Bar Lounge, Kuramae, Taito, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. On the Sumida River. Cafe 8 AM-6 PM, bar 6 PM-1 AM","layer":"alcohol-and-bars"},{"Name":"Game Center Mikado","Location":"Game Center Mikado, Takadanobaba, Shinjuku, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Retro arcade with regular Street Fighter tournaments","layer":"alcohol-and-bars"},{"Name":"Harmonica Yokocho","Location":"Harmonica Yokocho, Kichijoji, Musashino, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Nov 10 about 5 PM at dusk. Tight grid of tiny bars by Kichijoji\u0027s north exit, like Omoide Yokocho. Bar-hop until about 6:45. Each bar keeps its own hours","layer":"alcohol-and-bars"},{"Name":"Kinshicho izakaya area","Location":"Kinshicho Station, Sumida, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Dense izakaya and bar scene south of the station. Close to the hotel. Not researched in detail","layer":"alcohol-and-bars"},{"Name":"Nonbei Yokocho","Location":"Nonbei Yokocho, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, fits the Oct 30 Shibuya stop. Postwar alley by the tracks, a few dozen bars that seat about 6 each. Cheaper and less crowded than Omoide Yokocho. Station construction nearby so check before going","layer":"alcohol-and-bars"},{"Name":"Ameyoko","Location":"Ameyoko, Ueno, Taito, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Market street by day, standing bars and yakitori under the tracks at night. About 15 min from Ryogoku. Easiest yokocho from the second hotel","layer":"alcohol-and-bars"},{"Name":"Yurakucho under the tracks","Location":"Yurakucho Gado-shita, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Old izakaya in the brick arches under the JR line, salarymen and yakitori smoke. Short ride from Ryogoku. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Sanchoku Yokocho","Location":"Hibiya Okuroji, Yurakucho, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. Renovated 2019 alley of 11 bars, each focused on one region\u0027s food. Next to the Yurakucho arches. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Kanda under the tracks","Location":"Kanda Station, Chiyoda, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Optional Oct 28 ~7 PM nightcap after Yuzu Lab. Same under-the-tracks izakaya style near Yuzu Lab and Hitachino. Easy crawl before or after the Oct 28 dinner","layer":"alcohol-and-bars"},{"Name":"Ebisu Yokocho","Location":"Ebisu Yokocho, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Nov 8 about 8:30 PM after Hop Fest. About 20 izakaya stalls in a renovated indoor building, most open late","layer":"alcohol-and-bars"},{"Name":"Beer Boy Shibuya","Location":"Shibuya PARCO, 15-1 Udagawacho, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Oct 30 about 3:20 PM, one round before the 3:40 train (Adam\u0027s pick). Small standing bar on Parco B1, about 10 rotating Japanese taps. 11:30 AM-10:30 PM. Nintendo Tokyo and the Pokemon Center are on 6F","layer":"alcohol-and-bars"},{"Name":"Tokyo Beer Lab","Location":"3-26-5 Jingumae, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Oct 30 option after lunch, near the top of Cat Street. Small brewery we\u0027ve been to before. Daily 1-10 PM","layer":"alcohol-and-bars"},{"Name":"Baird Beer Harajuku Taproom","Location":"1-20-13 Jingumae, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Candidate, not scheduled. 2F No Surrender Bldg, 3 min from Harajuku Station\u0027s Takeshita exit. Weekdays from 5 PM (noon on weekends and holidays), so it misses the Oct 30 midday plan","layer":"alcohol-and-bars"},{"Name":"Spring Valley Brewery Tokyo (Hop Fest)","Location":"Spring Valley Brewery Tokyo, Log Road Daikanyama, Shibuya, Tokyo, Japan","City":"Tokyo","Type":"Event","Notes":"Nov 8 Craft Beer Japan Hop Fest, 6-8:30 PM session (last orders about 8). Up to 20 beers from 18 breweries. Advance 3800 yen on e+ (no refunds) or 2500 yen at the door. About 7 min walk from Ebisu","layer":"alcohol-and-bars"},{"Name":"Bathe Yotsume Brewery","Location":"Bathe Yotsume Brewery, Sumida, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Nov 8 optional, instead of the hotel break. Near Oshiage. Weekends from 3 PM. Check the pin location","layer":"alcohol-and-bars"},{"Name":"YONA YONA BEER WORKS Kichijoji","Location":"YONA YONA BEER WORKS Kichijoji, Musashino, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Nov 10 craft beer option in Kichijoji, about 5-6:45 PM. Yo-Ho Brewing taproom. 11:30 AM-10 PM daily","layer":"alcohol-and-bars"},{"Name":"Nakano Beer Kobo","Location":"Nakano Beer Kobo, Nakano, Tokyo, Japan","City":"Tokyo","Type":"Nightlife","Notes":"Nov 10 optional nightcap about 9 PM after Akiyoshi. Small brewpub near Nakano Station. Tue 5-11 PM, closed Mon. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Second Home (Halloween Bar Crawl)","Location":"Ark Shirakawa Park Building, 2-2-23 Sakae, Naka Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate for Oct 31 after dinner. Pick up the bar crawl wristband here (B1) 2 to 11 PM. 3500 yen through Oct 18 then 5000 yen","layer":"alcohol-and-bars"},{"Name":"Club MAGO (Supernatural Halloween)","Location":"Club MAGO, Shinsakae, Naka Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate for Oct 31. Costume party 8 PM to 5 AM with Live and Lounge VIO. 18 plus with ID. 3000 yen advance. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Shooters Sports Bar and Grill","Location":"Shooters Sports Bar and Grill, Sakae, Naka Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate for Oct 31. Low-key Halloween party from 7 PM. 1500 yen entry. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Toshun Sake Brewery Tour","Location":"JR Shin-Moriyama Station, Moriyama Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Event","Notes":"Dropped from Nov 1 (it ends at 4:30 PM, too late for Nabana). 1:30 to 4:30 PM, meets at JR Shin-Moriyama. 18000 yen. Pin is the meeting station","layer":"alcohol-and-bars"},{"Name":"Y. Market Brewing Kitchen","Location":"Y. Market Brewing Kitchen, Yanagibashi, Nakamura Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. Nagoya\u0027s original craft brewery. About 10 house beers. 7 min walk from Nagoya Station","layer":"alcohol-and-bars"},{"Name":"Endoji Brewing","Location":"Endoji Shopping Street, Nishi Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. Small taproom in the Endoji arcade near Nagoya Station. 3 to 11 PM. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Tall Boys Brewing","Location":"Tall Boys Brewing, Minami Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. 5 min from Kasadera Station. 8 taps and grilled cheese. Fri to Sun 3 to 11 PM. Closed Mon. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Koyoen Brewery","Location":"Nagoya Beer Garden Koyoen, Chikusa Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. Japan\u0027s oldest beer garden with an onsite brewery. 10 min walk from Fukiage Station on the hotel\u0027s subway line. 11:30 AM to 10 PM","layer":"alcohol-and-bars"},{"Name":"Myaa Brew","Location":"Myaa Brew, Imaike, Chikusa Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. Tiny 6-seat brewpub in Imaike bar area. Weekends noon to 11 PM. Closed Mon. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Ozone Craft Brewery","Location":"BREWPUB OZONE, Ozone, Kita Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. In the Ozone shopping arcade. Weekends 1 to 10 PM. Closed Mon and Tue. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Crazy Stone Brewing","Location":"Crazy Stone Brewing, Aratamabashi, Mizuho Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. New microbrewery inside a Sichuan hot pot bar. 5 min from Aratamabashi Station. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Y. Market Brewing West Taproom","Location":"Y. Market Brewing West Taproom, Nakagawa Ward, Nagoya, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate but out of the way. The brewery itself near Kami-Otai Station. Noon to 6 PM with irregular closures. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Totopia Brewery","Location":"Totopia Brewery, Nagakute, Aichi, Japan","City":"Nagoya","Type":"Nightlife","Notes":"Candidate. Taproom out by Ghibli Park. Only worth it if going that way. Check the pin location","layer":"alcohol-and-bars"},{"Name":"Harada Sake Brewery","Location":"Harada Sake Bre
