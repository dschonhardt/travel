<style>
/* Layout: phone-first app shell. Sticky header (title, Japan clock, swipeable day strip),
   one centered reading column, fixed bottom tab bar. Indigo (ai-zome) accent, vermilion (shu) for "now". */
:root {
  --paper: #f4f5f9;
  --surface: #ffffff;
  --ink: #1a2032;
  --muted: #5b6377;
  --line: #dde1eb;
  --indigo: #24397a;
  --indigo-soft: #e4e9f6;
  --on-indigo: #ffffff;
  --shu: #d4442a;
  --shu-soft: #fbe7e2;
  --font-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --nav-h: 60px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1220; --surface: #171c2d; --ink: #e6e8f0; --muted: #9ca3b7; --line: #283049;
    --indigo: #9db0f2; --indigo-soft: #1e2850; --on-indigo: #0e1220; --shu: #ff7155; --shu-soft: #3a1d18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1220; --surface: #171c2d; --ink: #e6e8f0; --muted: #9ca3b7; --line: #283049;
  --indigo: #9db0f2; --indigo-soft: #1e2850; --on-indigo: #0e1220; --shu: #ff7155; --shu-soft: #3a1d18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--indigo); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }
strong { font-weight: 700; }
code { font-size: .9em; background: var(--indigo-soft); padding: 0 4px; border-radius: 4px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 10px var(--gutter-r) 4px var(--gutter-l);
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b { color: var(--ink); font-weight: 700; }
.strip {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding: 6px var(--gutter-r) 10px var(--gutter-l); scroll-padding-inline: 16px;
}
.strip::-webkit-scrollbar { display: none; }
.chip-day {
  flex: 0 0 auto; width: 48px; display: grid; justify-items: center; gap: 0;
  padding: 5px 0 6px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-decoration: none; position: relative;
  font-variant-numeric: tabular-nums;
}
.chip-day .mo { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip-day .dn { font-size: 19px; font-weight: 700; line-height: 1.1; }
.chip-day .kj { font-size: 12px; color: var(--muted); }
.chip-day.is-today::after {
  content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--shu);
}
.chip-day.is-active { background: var(--indigo); border-color: var(--indigo); color: var(--on-indigo); }
.chip-day.is-active .mo, .chip-day.is-active .kj { color: var(--on-indigo); opacity: .8; }

/* Main column */
main {
  max-width: 680px; margin: 0 auto;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
  display: grid; gap: 16px;
}
main > * { min-width: 0; }

/* Day head */
.head { display: grid; gap: 10px; padding-block: 4px 2px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge-today { background: var(--shu); color: #fff; border-radius: 999px; padding: 1px 8px; letter-spacing: .06em; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 15px; text-wrap: pretty; }
.hotel {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.hotel-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.hotel-txt small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700;
  background: var(--indigo); color: var(--on-indigo); text-decoration: none; border: 0; cursor: pointer;
}
.btn svg { width: 15px; height: 15px; }
.jumps { display: flex; gap: 6px; flex-wrap: wrap; }
.jump {
  font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
}
.jump.now { border-color: var(--shu); color: var(--shu); font-weight: 700; }

/* Prose */
.prose { display: grid; gap: 10px; }
.prose p { margin: 0; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.prose li > ul, .prose li > ol { margin-top: 6px; }
.prose h4 { margin: 8px 0 0; font-size: 15px; letter-spacing: .02em; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.note { color: var(--muted); font-size: 14px; }
.xref { font-style: italic; }

/* Sections */
.sec { scroll-margin-top: 150px; }
.sec > summary, .sec > .sec-h {
  list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-display); font-size: 21px; font-weight: 700; padding-block: 8px 6px;
  border-bottom: 2px solid var(--ink); margin-bottom: 12px;
}
.sec > .sec-h { cursor: default; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after {
  content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg); margin-right: 4px; transition: transform .15s;
}
.sec:not([open]) > summary { margin-bottom: 0; }
.sec:not([open]) > summary::after { transform: rotate(-45deg); }
@media (prefers-reduced-motion: reduce) { .sec > summary::after { transition: none; } }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl-item {
  display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--line); position: relative;
}
.tl-item:first-child { border-top: 0; }
.tl-time { font-weight: 700; font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; padding-top: 1px; }
.tl-time .ap { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.tl-item.fixed .tl-time { color: var(--indigo); }
.tl-body { font-size: 15px; overflow-wrap: anywhere; }
.tl-item.is-past { opacity: .55; }
.tl-item.is-now {
  background: var(--shu-soft); border-radius: 12px; border-top-color: transparent;
  padding-inline: 10px; margin-inline: -10px;
}
.tl-item.is-now + .tl-item { border-top-color: transparent; }
.tl-item.is-now .tl-time { color: var(--shu); }
.tl-item.is-now .tl-time::before {
  content: "Now"; display: block; width: max-content; margin-bottom: 3px; font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; background: var(--shu); color: #fff; border-radius: 4px; padding: 0 6px;
}

/* Cards (wide tables) */
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.card h4 { margin: 0; font-size: 16px; }
.card dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.card dt { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 0; overflow-wrap: anywhere; }

/* Map pin */
.pin {
  display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px;
  width: 22px; height: 22px; margin-left: 3px; border-radius: 50%;
  background: var(--indigo-soft); color: var(--indigo);
}
.pin svg { width: 13px; height: 13px; }

/* Tasks */
li.task { list-style: none; margin-left: -1.3em; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; }
li.task .box {
  width: 16px; height: 16px; margin-top: 4px; border: 1.5px solid var(--muted); border-radius: 4px;
  display: grid; place-items: center; font-size: 11px; line-height: 1;
}
li.task.done { color: var(--muted); }
li.task.done .box { background: var(--indigo); border-color: var(--indigo); color: var(--on-indigo); }

/* Prev / next */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.pager a {
  display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); min-width: 0;
}
.pager a small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pager a span { font-weight: 700; font-size: 14px; }
.pager .next { text-align: right; grid-column: 2; }

/* Days list */
.days { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.day-row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center;
  padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none;
}
.day-row.is-today { border-color: var(--shu); }
.day-date { text-align: center; display: grid; font-variant-numeric: tabular-nums; }
.day-date .mo { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day-date .dn { font-size: 22px; font-weight: 700; line-height: 1.1; }
.day-date .kj { font-size: 12px; color: var(--muted); }
.day-row b { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.3; }
.day-row span.s { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; }
.leg { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }

/* Places */
.search {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.filters { display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: 0 0 auto; font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.chips button[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: var(--on-indigo); }
.count { font-size: 13px; color: var(--muted); }
.places { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.place { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.place-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.place-top > div { min-width: 0; }
.place b { display: block; line-height: 1.3; }
.place .meta { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.place p { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.built { font-size: 12px; color: var(--muted); text-align: center; }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l);
}
.nav-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav button {
  font: inherit; font-size: 12px; font-weight: 500; background: none; border: 0; cursor: pointer;
  color: var(--muted); display: grid; justify-items: center; align-content: center; gap: 2px;
}
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--indigo); font-weight: 700; }

.err { background: var(--shu-soft); color: var(--ink); padding: 12px; border-radius: 12px; }
</style>

<script type="application/json" id="trip-data">{"built":"Oct 30, 2026 7:29 AM","days":[{"id":"2026-10-27","md":"# Day 1 — Tue Oct 27 — Tokyo (arrival)\r\n\r\n**Visit Japan Web:** [log in here](https://services.digital.go.jp/en/visit-japan-web/) (official Digital Agency page, then hit the login button). Have the immigration and customs QR codes up before landing. The site has no app, so ignore any \"Visit Japan Web\" app.\r\n\r\n## Plan\r\nAll times are rough estimates. Adjust once the airport → hotel route is confirmed.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 2:35 PM | Land at HND (booked) |\r\n| 2:35–3:45 PM | Immigration, customs, bags. Turn on the eSIM (already bought) for data, and pick up a transit IC card if needed |\r\n| 3:45–4:30 PM | Train HND → Asakusabashi (~40 min) |\r\n| ~4:30–5:15 PM | Hotel: drop bags, check in (opens 3:00 PM), freshen up |\r\n| ~5:30–6:30 PM | Dinner: **standing sushi near the hotel**, a few minutes\u0027 walk. First choice **Sushi Uogashi Nihon-ichi Asakusabashi** (1-13-3 Yanagibashi, Tue 11 AM–10 PM, Google Maps). Or **Maguro-jin Asakusabashi** (まぐろ人 浅草橋出張所, 1-17-16 Asakusabashi, Tue 11:30 AM–10 PM, Google Maps) |\r\n| ~6:45–9:30 PM | Akihabara (JR Sobu Line, 1 stop): arcades and wandering. Stop at **Don Quijote** or a konbini for Black Thunder chocolate bars and snacks |\r\n| ~10:00 PM | Back at the hotel. Early night after a long travel day |\r\n\r\nYuzu Lab Noodles is skipped tonight (it\u0027s dinner Oct 28 and the last meal Nov 11). Backup dinner: **Sushi Uogashi Nihon-ichi, Atre Akihabara** (standing sushi at Akihabara Station, Tue 10 AM–10:30 PM, Google Maps), right at the arcades.\r\n"},{"id":"2026-10-28","md":"# Day 2 — Wed Oct 28 — Tokyo (gyudon, capybaras, Asakusa, Akihabara)\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n**Capybara cafe swap:** the one on the Google Map, [cafe capyba ASAKUSA](https://cspace.co.jp/en/our-shop_english/) (1-1-4 Senzoku), is **closed Wednesdays and Thursdays**. Its only open days in our Tokyo block are Tue Oct 27 (arrival) and Fri Oct 30 (Kamakura), so it doesn\u0027t fit. [CAPPINESS Oshiage](https://cappiness.jp/) is open daily, is one direct train from the hotel, and sits across the river from Asakusa.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| ~6:30 AM | *Optional:* **~30 min jet-lag run along the Sumida River** (see the route below). Sunrise is ~5:55 AM, so it\u0027ll be light out |\r\n| 9:00 AM | **Gyudon breakfast** near the hotel: **Matsuya Asakusabashi** (24 hrs, 1-13-4 Yanagibashi) or **Yoshinoya Asakusabashi East Exit** (1-30-1 Asakusabashi, ~1 min from the station) |\r\n| 9:40 AM | Toei Asakusa Line to Oshiage (~10 min). CAPPINESS is on 5F of **JU SKYTOWER MUKOJIMA** (Mukojima 3-43-10), ~4–5 min north of the station, not at Skytree itself. Use the north exits (A1/B1). Aim to arrive by ~10:05, since the 40-min session starts at the booked time |\r\n| 10:15 AM | **CAPPINESS Oshiage** capybara cafe: 40-min session, ¥4,000 pp, includes drinks, capybara snacks for feeding, a group photo, and a small souvenir. **Booked for 10:15 AM** |\r\n| 11:00 AM | Walk ~20 min across Azuma Bridge to Asakusa. Good views back to Skytree and the Asahi \"golden flame\" building |\r\n| 11:30 AM | **Senso-ji**: Kaminarimon gate, **Nakamise Dori** snack stalls, the main hall and five-story pagoda. Wander Denboin-dori and the side streets |\r\n| 12:45 PM | **Lunch in Asakusa**: **Hoppy Street** stew (nikomi) and beer at the open-air izakaya, or tempura, a classic Asakusa lunch |\r\n| 2:15 PM | Tsukuba Express Asakusa → Akihabara (~5 min) |\r\n| 2:30 PM | **Explore Akihabara** (~1.5 hrs): arcades, anime and electronics shops, side streets |\r\n| 4:20 PM | Beer at **Hitachino Brewing Lab** (mAAch ecute Kanda Manseibashi, 1-25-4 Kanda Sudacho): Kiuchi Brewery\u0027s taproom in the old brick railway arches by the Kanda River, ~5–10 min walk south of Akihabara Electric Town. Open daily 11:00 AM–10:00 PM (Sun to 9:00 PM, Google Maps) |\r\n| 5:45 PM | Dinner at **Yuzu Lab Noodles** (2-8 Kanda Sudacho), a few minutes\u0027 walk from Hitachino. Wed 11 AM–10 PM (Google Maps). Getting there before ~6 PM also beats the dinner line |\r\n| ~7:00 PM | *Optional:* **nightcap under the tracks in Kanda** (gado-shita): yakitori, motsuyaki and standing bars in the JR arches around Kanda Station, ~5–7 min walk south of Yuzu Lab. One or two rounds, then home: JR from Kanda to Akihabara, change to the Sobu Line for 1 stop to Asakusabashi (or walk ~20 min). Kamakura starts early tomorrow, so aim for bed by ~10:30 |\r\n\r\n## Optional morning run (~30 min, ~4.5–5 km)\r\nLoop on the **Sumida River Terrace** (the riverside path along both banks), starting from the hotel:\r\n1. Hotel → walk/jog ~5 min east to the river at **Yanagibashi**, where the Kanda River meets the Sumida\r\n2. Cross **Ryogoku Bridge** to the east bank and run north on the terrace\r\n3. Keep going past Kuramae Bridge to **Komagata Bridge** (Asakusa side). Good view of Skytree and the Asahi \"golden flame\" building\r\n4. Cross back to the west bank and run south on the terrace back to Yanagibashi and the hotel\r\n\r\nShorter version (~20–25 min): turn around at **Kuramae Bridge** instead. Parts of the terrace can be closed for construction. If you hit a closure, go up to the street that runs alongside the river and drop back down after it.\r\n\r\n## Travel\r\n- Hotel → **Oshiage** (Skytree): Toei Asakusa Line straight from Asakusabashi, ~10 min, no transfers\r\n- Oshiage → **Asakusa**: walk ~20 min across the Sumida River (Azuma Bridge), or 2 stops on the Toei Asakusa Line (Honjo-Azumabashi, then Asakusa)\r\n- Asakusa → **Akihabara**: Tsukuba Express, ~5 min (TX Asakusa Station is ~5 min walk west of Senso-ji)\r\n\r\n## Lodging\r\n- **Hotel LiVEMAX Asakusabashi-Ekimae** (booked) — 1-1-14 Asakusabashi, Taito, Tokyo 111-0053\r\n- Night 2 of 4\r\n\r\n## TODO\r\n- [x] **Book CAPPINESS Oshiage** for the 10:15 AM slot: booked (TableCheck, [booking page](https://www.tablecheck.com/en/shops/cappiness-oshiage/reserve))\r\n- [x] Double-check CAPPINESS Oshiage hours for a Wednesday: the 10:15 AM booking went through, so the slot is confirmed\r\n"},{"id":"2026-10-29","md":"# Day 3 — Thu Oct 29 — Tokyo (Kamakura + Enoshima day trip)\r\n\r\nSwapped with the west-side Tokyo day (now [Fri Oct 30](./2026-10-30.md)) so the ramen festival, which opens Oct 30, fits.\r\n\r\n## Plan\r\nAll times are rough estimates. Kamakura\u0027s leaves don\u0027t turn until early December, so nothing is lost by going now.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 7:25 AM | Leave the hotel for the **7:41 AM** Sobu Rapid / Yokosuka Line from Bakurocho (bound for Kurihama), arriving Kita-Kamakura **8:39** (58 min, direct, ¥1,034 IC). Backups: 7:48 (arr 8:48) and 7:57 (arr 8:59). Rush hour, so expect to stand through Tokyo/Shinagawa. Get off at **Kita-Kamakura**, one stop before Kamakura. **Buy breakfast and hike snacks/water at a konbini beforehand.** There\u0027s little food at Kita-Kamakura or on the trail until Hase |\r\n| 8:40 AM | **Engaku-ji**: large Zen temple complex right beside the station. Quiet in the morning |\r\n| 9:30 AM | Walk ~5 min to **Jochi-ji**, a small moss-and-cedar Zen temple. The **Daibutsu Hiking Course** trailhead is right beside it |\r\n| 9:45 AM | **Hike the Daibutsu course**: forested ridge trail with roots, some steep rocky sections, and a few glimpses toward the sea |\r\n| ~10:15 AM | **Kuzuharaoka Shrine**, about halfway. Good rest stop |\r\n| ~10:30 AM | **Genjiyama Park**. Optional ~10 min detour down to **Zeniarai Benten**, a cave shrine where people wash their money for luck, then rejoin the trail |\r\n| ~11:15 AM | Trail comes out near Hase. Walk down to **Kotoku-in (Great Buddha)**: 13th-century bronze Buddha. Small extra fee to go inside it |\r\n| 11:45 AM | **Hase-dera**: hillside temple with an ocean-view terrace and a small cave shrine |\r\n| 12:45 PM | Lunch near Hase: **shirasu-don** (whitebait rice bowl), the local specialty. **Hase Shokudo**, right beside Hase Station, is the closest option. See Foods to try. **Check [enoshima-seacandle.com](https://enoshima-seacandle.com/information/post-4039/) for a Shonan Candle weather cancellation** (posted by 12:00 noon on the day). If it\u0027s off, skip the 5:00 slot, eat dinner earlier and head home sooner |\r\n| 1:30 PM | Enoden from Hase to **Kamakura** (5 min). Keep lunch quick so the afternoon starts on time |\r\n| 1:45 PM | **Komachi-dori** snack crawl (sausage, purple sweet potato soft-serve), then up to **Tsurugaoka Hachimangu**, Kamakura\u0027s main shrine (free). Kurumiko and Hato Sable shops are on the way. See Foods to try. Keep this to ~1 hr |\r\n| 3:00 PM | Grab **Kamakura Wich** (the raisin sandwich) at the west exit, then Enoden from Kamakura to **Enoshima** (~25 min). Sit on the ocean side. It passes the Kamakurakokomae seaside railroad crossing. **Don\u0027t leave later than this**: the shrine closes at 5:00 |\r\n| ~3:40 PM | **Tako senbei** at the Enoshima Ekimae shop near the station (open until 6:00), then walk the causeway onto **Enoshima** (~15 min). Snack on the shopping street now; most stalls close around 5–6 PM |\r\n| ~4:10 PM | **Enoshima Shrine** (8:30 AM–5:00 PM). See the **Hoanden** (Benzaiten statue, ¥200) first, since it closes at **4:30** |\r\n| ~4:40 PM | **Escar** up to the **Sea Candle** for sunset (~4:47 PM), with the view back along the coast. At the Escar ticket window, buy the **Sea Candle set + Night ticket (¥1,550)**: it covers the Escar, the Sea Candle and the evening garden (the garden is ¥500 after 5:00 on event nights), saves ~¥250 pp and avoids a second line at 5:00 |\r\n| 5:00 PM | **Shonan Candle 2026** (Oct 10–Nov 3): ~10,000 hand-lit candles in the Samuel Cocking Garden, lit from 5:00. Walk the garden as it gets dark. Weekdays open until 8:00 PM, last entry 7:30 |\r\n| ~6:00 PM | Walk down to dinner at **Tobiccho Enoshima main store** (Shirasu Tonya Tobiccho), on the shopping street near the bottom. Raw shirasu, sakura shrimp and seafood bowls. **Thursday 11:00–20:00** (Google), so last order is probably ~7:30: don\u0027t drift past ~7:00. Open daily except in storms. 0466-23-0041. Expect a short wait. **Backup:** **Enoshima Kaisaku**, grilled shellfish (iso-yaki) and shirasu bowls, ~6 min from Katase-Enoshima Station. It closes at **7:00 PM on weekdays**, so sit down by 6:00. **Skip** Cyubei: it\u0027s closed Thursdays |\r\n| 7:15 PM | Head back: ~20 min walk over the causeway (lit at night) to **Shonan-Enoshima**. **7:41 PM** Shonan Monorail → Ofuna (7:56), then the **8:13** Yokosuka Line → Bakurocho (9:04). The 7:49 monorail (Ofuna 8:03) makes the same train. ¥1,242 IC total |\r\n| ~9:10 PM | Back at the hotel |\r\n\r\n**If running behind:** skip Engaku-ji and start straight at Jochi-ji. If you\u0027re short on time in the afternoon, drop Komachi-dori and Tsurugaoka and ride the Enoden from Hase straight to Enoshima (~20 min). If you reach Enoshima late anyway, put the shrine first; the Sea Candle and the candles stay open until 8:00, so they can wait.\r\n\r\n**Dropped for the hike:** Kencho-ji and the Hokokuji bamboo grove. Hokokuji is on the far east side of town and doesn\u0027t fit with the hike. Save it for a future trip.\r\n\r\n## Travel\r\n- Hotel → **Bakurocho Station** (~5–7 min walk) → JR Yokosuka Line (Sobu Rapid) straight to **Kita-Kamakura**, 58–62 min, no transfers, ¥1,034 on Suica (Yahoo Transit, checked Oct 25 for Thu Oct 29)\r\n- **Daibutsu Hiking Course** on foot: Kita-Kamakura → Great Buddha, ~3 km, ~1–1.5 hrs (confirmed open)\r\n- Around Kamakura: Enoden train Hase → Kamakura → Enoshima\r\n- Return: Shonan Monorail Shonan-Enoshima → Ofuna, then the Yokosuka Line straight back to Bakurocho: 1h15–1h25 station to station (monorail 14–15 min, Ofuna → Bakurocho 51 min, plus the wait at Ofuna), so ~1h55 from Tobiccho to the hotel. ¥1,242 on Suica (Yahoo Transit, checked Oct 25)\r\n\r\n## Lodging\r\n- **Hotel LiVEMAX Asakusabashi-Ekimae** (booked) — 1-1-14 Asakusabashi, Taito, Tokyo 111-0053\r\n- Night 3 of 4\r\n\r\n## Foods to try\r\n\r\nIn rough route order. Kamakura asks people not to eat while walking on crowded streets, so eat at or beside the stall.\r\n\r\n| Food | What it is | Where on the route | Hours |\r\n|---|---|---|---|\r\n| **Shirasu-don** | Whitebait on rice, the Kamakura/Shonan specialty. Ask for **nama shirasu** (raw) if that morning\u0027s catch came in; the season runs through Dec | **Hase Shokudo**, right beside Enoden Hase Station (lunch). **Tobiccho Enoshima main store** on the island (dinner) | Hase Shokudo: check before going. Tobiccho: Thu 11:00–20:00 (Google) |\r\n| **Sausage** | Grilled sausage on a stick | **Kamakura Ham Tomioka Shokai**, Komachi-dori (2-2-19 Komachi). Kamakura\u0027s ham maker since 1900; also sells croquettes to eat on the spot | 10:00 AM–6:00 PM, open daily |\r\n| **Purple sweet potato soft-serve** (murasaki-imo) | Kamakura\u0027s signature soft-serve | **Imoyoshikan**, Komachi-dori (2-8-3 Komachi) | 10:00 AM–5:30 PM, open daily |\r\n| **Kurumiko** | Walnut-caramel bars between butter cookies, in the squirrel packaging | **Kamakura Beniya Hachimangu-mae main store**, across from Tsurugaoka Hachimangu (1-12-4 Yukinoshita) | 9:30 AM–5:00 PM |\r\n| **Hato Sable** | Dove-shaped butter cookies, Kamakura\u0027s classic souvenir since 1897. The main store sells pigeon goods you can\u0027t get elsewhere | **Toshimaya main store**, Wakamiya-oji near the second torii (2-11-19 Komachi), on the walk between Komachi-dori and the shrine | 9:00 AM–7:00 PM. Closed some Wednesdays, so Thursday is fine |\r\n| **Raisinwich** | Rum-soaked raisins and buttercream between sablé cookies. Now sold as **Kamakura Wich**: Kamakura Ogawaken renamed both the shop and the cookie on Nov 1, 2025 | **Kamakura Wich main store**, Onari-dori, ~1 min from Kamakura Station\u0027s west exit (8-1 Onari-machi). The Enoden leaves from the same side | 10:00 AM–6:00 PM |\r\n| **Tako senbei** | Whole octopus pressed flat into a big cracker under a 1-ton press | Asahi Honten on the island (1-4-8 Enoshima) is **closed Thursdays**. Use **Maruyaki Tako Senbei Enoshima Ekimae** instead (1-11-31 Katase Kaigan), ~230 m from Enoden Enoshima Station on the walk to the causeway. Other stalls on the island\u0027s Nakamise street also sell it | 10:30 AM–6:00 PM, listed as open daily (Tabelog; not confirmed with the shop) |\r\n\r\n**Sources:** [Kamakura Ham Tomioka Shokai](https://www.kamakuraham-tomioka.co.jp/about/store/) · [Imoyoshikan](https://www.cocolocala.jp/spots/92279) · [Kamakura Beniya](https://beniya-ajisai.co.jp/shop/head/) · [Toshimaya](https://www.hato.co.jp/shop) · [Kamakura Wich rebrand](https://prtimes.jp/main/html/rd/p/000000013.000166308.html) · [Kamakura Ogawaken stores](https://ogawaken.jp/category/store/) · [Asahi Honten](https://www.tabiulala.com/kamasho/spot077/) · [Hase Shokudo](https://haseshokudo.com/) · [Tobiccho hours](https://www.kanagawa-kankou.or.jp/spot/6474) · [Enoshima Kaisaku](https://enoshima-kaisaku.owst.jp/) · [Sea Candle hours](https://enoshima-seacandle.com/opening-hours/) · [Shonan Candle 2026](https://enoshima-seacandle.com/information/post-4039/) · [Escar](https://enoshima-seacandle.com/facilities/escar/) · [Hoanden hours](https://enokama.jp/spot/6591/) · [Enoshima stall closing times](https://kiyotaryokan.jp/enoshima-streetfood-hours/)\r\n\r\n## TODO\r\n- [x] Daibutsu Hiking Course is open (confirmed)\r\n- [ ] Hiking prep: shoes with grip (roots and rock, slick if it\u0027s rained), water, and a small bag. No big luggage on the trail\r\n- [ ] Confirm temple hours and fees. Most open ~8–9 AM and close ~4–5 PM, which is why the temples come first and Enoshima comes last\r\n- [ ] Confirm Hase Shokudo\u0027s hours for lunch (or pick another Hase spot)\r\n- [x] Dinner spot on Enoshima: Tobiccho main store, with Kaisaku as backup (hours from listings, not confirmed with the shops)\r\n- [x] Check the Shonan Candle / Sea Candle ticket price: buy the Sea Candle set + Night (¥1,550) at the Escar window\r\n- [ ] At lunch, check enoshima-seacandle.com for a Shonan Candle weather cancellation (posted by noon)\r\n- [ ] Passes: just use Suica. The Enoden day pass barely pays for itself with 2–3 rides, and the Odakyu Enoshima-Kamakura Freepass starts from Shinjuku, which doesn\u0027t suit this route\r\n"},{"id":"2026-10-30","md":"# Day 4 — Fri Oct 30 — Tokyo (Shinjuku Gyoen, Meiji Jingu, Harajuku, Shibuya, Shinjuku at night)\r\n\r\nThe Kamakura day trip moved to [Thu Oct 29](./2026-10-29.md). The Tokyo Ramen Festa (Komazawa) was dropped from today because it\u0027s too far out of the way.\r\n\r\n## Travel\r\n- Hotel → **Sendagaya** (Shinjuku Gyoen): JR Chuo-Sobu local straight from Asakusabashi, ~20 min, no transfers\r\n- Sendagaya → Meiji Jingu → Harajuku → Shibuya: all on foot\r\n- Shibuya → **Shinjuku**: JR Yamanote Line (~7 min), then ~12–15 min from the west exit to the Metropolitan Government Building\r\n- Evening in Shinjuku: stay on the west side (TMG, Omoide Yokocho), then cross under the tracks once to the east side (Kabukicho, Golden Gai)\r\n- Shinjuku → hotel: JR Chuo-Sobu local straight to Asakusabashi, ~20 min\r\n\r\n## Lodging\r\n- **Hotel LiVEMAX Asakusabashi-Ekimae** (booked) — 1-1-14 Asakusabashi, Taito, Tokyo 111-0053\r\n- Night 4 of 4. Check-out is Sat Oct 31 before 10:00 AM\r\n\r\n## Plan\r\nAll times are rough estimates. Nothing is fixed except catching sunset at the Metropolitan Government Building.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 8:15 AM | Konbini breakfast, then Chuo-Sobu local to Sendagaya |\r\n| 9:00 AM | **Shinjuku Gyoen** at opening, via the Sendagaya Gate (¥500). Japanese garden, the big lawn, the greenhouse. Oct–Mar last entry is 4:00 PM, so morning is the time |\r\n| 10:30 AM | Walk ~15 min to **Meiji Jingu**\u0027s north (Kitasando) entrance. Go through the forest to the main hall, then out the south side at Harajuku |\r\n| 11:45 AM | **Takeshita Street**: crowded and slow-moving, so allow ~1 hr for shops and snacks (crepes etc.) |\r\n| 12:45 PM | **Lunch in Harajuku / Omotesando**, two options: **Tonkatsu Maisen Aoyama** (4-8-5 Jingumae, Omotesando side): famous tonkatsu in an old converted bathhouse, open daily 11:00 AM–9:00 PM (Google), long lunch lines. Or **Smokehouse** (2F, 5-17-13 Jingumae, on Cat Street): American BBQ with T.Y. Harbor craft beer, Tabelog 3.49, open daily 11:30 AM–10:00 PM |\r\n| 1:45 PM | Browse down **Cat Street** to Shibuya (~1.2 km of shops and cafés), ~1–1.5 hrs |\r\n| 3:00 PM | **Shibuya crossing** and Hachiko. Walk the crossing, then watch it from above for free through the windows of the **Shibuya Station ↔ Mark City walkway**, where Taro Okamoto\u0027s huge *Myth of Tomorrow* mural is too (~15 min). Then ~5 min up Koen-dori to **Shibuya Parco** for a quick round at **Beer Boy** (see below) |\r\n| 3:40 PM | JR Yamanote Line to Shinjuku. Don\u0027t leave later: the west-exit walk, TMG security check and elevator line can take 30+ min on a pre-Halloween Friday |\r\n| 4:30 PM | **Metropolitan Government Building** South Observation Deck for sunset (~4:47 PM). Free, open until 10:00 PM (last entry 9:30), ~12–15 min walk from Shinjuku\u0027s west exit. If the South deck line is long, the North deck is the backup (last entry 5:00 PM) |\r\n| 6:00 PM | **TOKYO Night \u0026 Light** projection mapping on Tower 1\u0027s east wall, watched from Citizens\u0027 Plaza. Free, ~10–15 min. Late-Oct shows at 6:00, 6:30, 7:00 … 9:30 ([timetable](https://tokyoprojectionmappingproject.jp/en/)) |\r\n| 6:20 PM | Walk ~12 min to **Omoide Yokocho** for dinner: yakitori and beer. Friday stalls seat 6–10 and fill by 7, so arriving early makes seating four together easier |\r\n| 7:45 PM | Cross under the tracks to **Kabukicho**: Godzilla head, Kabukicho Tower (17F deck and gelato; go before 10) |\r\n| 8:45 PM | Drinks in **Golden Gai**, ~3 min from the tower |\r\n| ~10:00 PM+ | Chuo-Sobu local back to Asakusabashi (last trains well after midnight) |\r\n\r\n**Beer spots to check out (Harajuku / Cat Street):**\r\n- **Tokyo Beer Lab** (3-26-5 Jingumae): a small brewery in the Omotesando backstreets near the top of Cat Street. We\u0027ve been before. Open daily 1:00–10:00 PM, so it fits after lunch, before or during the Cat Street walk ([Metropolis](https://metropolisjapan.com/best-craft-beer-in-tokyo/), [Time Out](https://www.timeout.jp/tokyo/ja/バー/tokyo-beer-lab))\r\n- **Baird Beer Harajuku Taproom** (2F No Surrender Bldg, 1-20-13 Jingumae, ~3 min from Harajuku Station\u0027s Takeshita exit). **Weekdays it opens at 5:00 PM** (noon on weekends and holidays), so it doesn\u0027t fit this Friday\u0027s midday plan. Worth a trip back on another evening if one opens up ([Time Out](https://www.timeout.com/tokyo/bars-and-pubs/harajuku-taproom))\r\n\r\n**Beer Boy (Shibuya Parco B1)** 🟢 Adam\u0027s pick: a small standing craft-beer bar with ~10 rotating Japanese taps, 11:30 AM–10:30 PM (Google). One round between the crossing and the 3:40 train. Parco\u0027s 6F also has **Nintendo Tokyo** and a **Pokémon Center**. If running late, cut Cat Street short rather than this ([Beer Tengoku](https://beertengoku.com/2020/02/19/tachinomi-beer-boy-shibuya-in-shibuya-tokyo/))\r\n\r\n**Shibuya crossing view (free, ~15 min):** the glass-walled walkway between Shibuya Station and **Mark City** looks straight down on the crossing. Inside the station, follow the signs for Mark City or the Keio Inokashira Line. Taro Okamoto\u0027s 30 m *Myth of Tomorrow* mural (1969) is in the same passage. Walk the crossing at street level first, then go up and watch the next wave. The paid rooftop options are **Shibuya Sky** and the **MAGNET by SHIBUYA109** rooftop: higher up, but they cost money and take longer ([Islands.com](https://www.islands.com/1834565/best-way-how-see-tokyo-japan-shibuya-crossing-above-without-spending-yen-free))\r\n\r\n**Halloween weekend:** tonight is the night before Halloween. Expect extra crowds and possible street-drinking restrictions around Shibuya and Kabukicho. Shibuya is a midday stop and the Shinjuku drinking is inside bars, so it shouldn\u0027t change the plan.\r\n\r\n**If running behind:** shorten Cat Street or the Shibuya stop. Aim to reach Shinjuku by ~4:30 PM for sunset.\r\n\r\n**Skipped:** teamLab Borderless.\r\n\r\n## TODO\r\n- [ ] Pack for the Nagoya move before going out (check-out is before 10:00 AM tomorrow, leaving at 8:30)\r\n- [ ] Bring cash for Omoide Yokocho and Golden Gai (many bars are cash-only, and some charge a cover)\r\n- [ ] Pick lunch: Maisen Aoyama or Smokehouse (hours from listings, not confirmed with the restaurants)\r\n"},{"id":"2026-10-31","md":"# Day 5 — Sat Oct 31 — Tokyo → Nagoya (Shinkansen, Osu, misokatsu, Sakae, tebasaki)\r\n\r\n## Plan\r\nAll times are rough estimates. Today covers Osu and Sakae, which leaves Sunday for Nagoya Castle and the bigger outings (museums, sake tour, or Nabana no Sato).\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 7:45 AM | **Gyudon breakfast** near the hotel (Matsuya is open 24 hrs), last one in Tokyo for now |\r\n| 8:30 AM | Check out, train to Tokyo Station |\r\n| 9:00 AM | Tokyo Station: grab snacks or an ekiben for the ride |\r\n| 9:45 AM | **Nozomi 141** to Nagoya (booked). Sit on the right side (seats D/E) for **Mt. Fuji**, about 40–45 min in |\r\n| 11:23 AM | Arrive Nagoya. Sakuradori Line 3 stops to **Hisaya-odori** (not Marunouchi), ~4 min walk to the hotel. Drop bags |\r\n| ~11:55 AM | Walk 4 min back to Hisaya-odori, then Meijo Line 2 stops to **Yaba-cho**, ~12 min total |\r\n| ~12:15 PM | Lunch at **Yabaton Yaba-cho Honten** (3-6-18 Osu, ~5 min from Yaba-cho Station): misokatsu at the original shop, plus the curry bun. Open daily 11:00 AM–9:00 PM. Saturday noon is busy, so expect a line |\r\n| 1:15 PM | Walk west into Osu (~10 min): **Osu Shopping Arcade**, then **Osu Kannon** temple. **Osu Uiro main store** (2-18-42 Osu, 10:00 AM–6:00 PM, open daily) for **uiro**, the steamed rice cake: grab the 5-flavor bite-size box (¥550). Take your time; there\u0027s slack until the tower |\r\n| 3:15 PM | Walk north through **Hisaya-odori Park** to Sakae (~25 min from Osu Kannon) |\r\n| 3:45 PM | **Oasis 21** \"Water Spaceship\" rooftop (free, 10:00 AM–9:00 PM) |\r\n| 4:30 PM | **Mirai Tower** observation decks for sunset (~5:00 PM) and the lights coming on. ¥1,300, Saturdays open until 9:40 PM |\r\n| 5:45 PM | Walk ~5 min back to the hotel (Mirai Tower is at Hisaya-odori, no train needed). Check in, **hot spring bath** |\r\n| 7:30 PM | Dinner: **tebasaki** at **Furaibo Sakae** (4-5-8 Sakae, ~3 min from Sakae Station exit 12). Fri/Sat 5:00 PM–midnight. Reserve for 4 |\r\n| 9:00 PM | Optional: a beer in Sakae, or an early night |\r\n\r\n**Halloween:** it\u0027s Halloween night. Sakae and Osu get costumed crowds, but it\u0027s far calmer than Shibuya. Nothing to plan around.\r\n\r\n**If the train runs late:** skip Oasis 21 and go straight up the tower.\r\n\r\n## Foods to try\r\n\r\n| Food | What it is | Where today |\r\n|---|---|---|\r\n| **Misokatsu** (Hatcho miso) | Pork cutlet under a thick red miso sauce | **Yabaton Yaba-cho Honten**, noon lunch |\r\n| **Uiro** | Chewy steamed rice-flour cake, Nagoya\u0027s classic sweet | **Osu Uiro main store** in the Osu arcade |\r\n| **Tebasaki** | Crispy wings with a sweet soy glaze, pepper and sesame | **Furaibo Sakae**, dinner. Eat them by pulling the two bones apart |\r\n| **Doteni** (Hatcho miso) | Beef tendon or offal stewed in red miso | On the menu at most Nagoya izakaya, often Furaibo too. Order it if you see it |\r\n\r\nMore red miso and the Chita beef dinner are on [Nov 1](./2026-11-01.md).\r\n\r\n## Travel\r\n- Hotel → **Tokyo Station**: JR Chuo-Sobu local one stop to Akihabara, then Yamanote or Keihin-Tohoku two stops. ~15 min\r\n- **Tokaido Shinkansen** Tokyo → Nagoya, Nozomi, ~1h40. ¥10,560 unreserved / ¥11,300 reserved (~$70–75 pp one-way). Booked: **Nozomi 141**, departs Tokyo **9:45 AM**, arrives Nagoya **11:23 AM**, so lunch at Yabaton lands around 12:15. Seats and reservation number are in confirmations.md\r\n- Nagoya Station → hotel: Sakuradori subway line three stops to **Hisaya-odori**. The hotel is ~250 m (~4 min) from Hisaya-odori and ~700 m (~9 min) from Marunouchi, so Hisaya-odori is its station despite the name\r\n- Around Nagoya: Hisaya-odori → Yaba-cho on the Meijo Line (2 stops); Yaba-cho → Osu → Sakae on foot; Mirai Tower → hotel on foot (~5 min)\r\n\r\n## Lodging\r\n- Check out: Tokyo hotel before 10:00 AM\r\n- Check in: **Hotel LiVEMAX PREMIUM Nagoya Marunouchi** (booked) — 3 Chome-16-22 Marunouchi, Naka Ward, Nagoya, Aichi 460-0002\r\n- Night 1 of 2. Check-in after 3:00 PM (drop bags on arrival)\r\n\r\n## TODO\r\n- [x] **Shinkansen booked (4 seats, Oct 24):** Nozomi 141, 9:45 AM → 11:23 AM. Seats and reservation number are in confirmations.md (kept local). Bags over 160 cm total (L+W+H) need an oversized-baggage seat reservation\r\n- [ ] **Reserve Furaibo Sakae** for 4 at ~7:30 PM (online booking available)\r\n- [ ] Confirm the hotel will hold bags before check-in\r\n- [x] Sunday Nov 1 evening: Nabana no Sato (decided). The afternoon is still open; see [Nov 1](./2026-11-01.md)\r\n"},{"id":"2026-11-01","md":"# Day 6 — Sun Nov 1 — Nagoya (castle, Atsuta Jingu, Nabana no Sato illumination)\r\n\r\nLast full day with all four of us. Halloween night runs late, so the morning starts easy. Nagashima Zombie Island is dropped. **Evening is Nabana no Sato** (decided), probably **Dan solo**: the others are likely heading to one of the museums (Toyota Commemorative Museum or SCMAGLEV, not picked). Afternoon is **Atsuta Jingu**, then an early **hitsumabushi** (eel) dinner at Nagoya Station on the way to Nabana.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 9:00 AM | Easy breakfast near the hotel (Komeda\u0027s Coffee is the classic Nagoya \"morning set\") |\r\n| 9:30 AM | **Nagoya Castle**, ~15 min walk from the hotel (or Meijo Line 1 stop, Hisaya-odori → Nagoyajo). ¥1,000, includes the **Honmaru Palace** (the main keep is still closed). The **chrysanthemum festival** (late Oct–late Nov) is on the grounds. Keep it to ~1.5 hrs |\r\n| ~11:15 AM | Lunch: **miso nikomi udon** at **Yamamotoya Sohonke, Kinshachi Yokocho** (right outside the castle\u0027s main gate, Yoshinao zone). Thick udon cooked in a clay pot of Hatcho-blend red miso broth; the noodles are firm on purpose. 10:30 AM–5:30 PM (last order 5:00), open daily |\r\n| ~12:15 PM | Optional rest at the hotel (~15 min walk from the castle) after the late Halloween night |\r\n| ~1:30 PM | Meijo Line from **Hisaya-odori** (counter-clockwise via Sakae and Kanayama) to **Atsuta Jingu Nishi**, 7 stops (~15 min), then ~7 min walk to the shrine. If skipping the hotel rest, board at Nagoyajo instead (~20 min) |\r\n| ~2:00 PM | **Atsuta Jingu**: grounds are free. Walk out to the South Gate and the main approach, under the giant camphor trees. Optional **Kusanagi-kan** sword museum (¥500, last entry 4:00 PM) |\r\n| ~3:15 PM | Walk ~3 min to Meitetsu **Jingu-mae**, then Meitetsu to Nagoya Station (~6 min). Walk through the station to **Esca**, the underground mall on the west (Taiko-dori) side (~10 min) |\r\n| ~3:40 PM | **Hitsumabushi at Hitsumabushi Ino** (Esca, Nagoya Station): grilled eel over rice, eaten three ways (plain, with condiments, then with broth). 11:00 AM–9:30 PM with no afternoon break. Mini bowls available, handy since lunch was at 11:15. ~45 min |\r\n| ~4:30 PM | Walk back east through the station to **Kintetsu Nagoya** (~10 min; it\u0027s next to Meitetsu, not on the JR side). At the Kintetsu limited-express ticket window, buy the **Nabana no Sato illumination set ticket** (なばなの里 イルミネーション セット券, **¥3,670**): round-trip Kintetsu train + bus, admission and the ¥1,000 voucher. Allow ~5 min |\r\n| ~4:45 PM | **Kintetsu Nagoya Line** to **Kintetsu Nagashima** (~22 min; weekend expresses stop there from Oct 31, check the board), then the direct bus to Nabana no Sato (~10 min) |\r\n| ~5:30 PM | **Nabana no Sato illumination**: lights are on by now (sunset ~4:58 PM). Gold light tunnel, the big light show, the flower gardens. Admission is covered by the set ticket and includes a ¥1,000 food voucher. Use it on snacks and drinks, since dinner was the eel. Open until 10:00 PM on Sundays |\r\n| ~8:30 PM | Bus back to Kintetsu Nagashima, then Kintetsu to Nagoya. **The last bus is ~10:00 PM on Sundays** (Nabana closes at 10; the later buses only run on 11 PM nights), so there\u0027s still slack |\r\n| ~9:30 PM | Back at the hotel. **Pack tonight**: check-out is before 10:00 AM and the Hida Express leaves at 9:39 |\r\n\r\n**Afternoon:** Atsuta Jingu (decided). It sits just south of Nagoya Station, so it\u0027s a short detour on the way to Nabana. More detail in [city-ideas.md](../city-ideas.md). Dropped: the Tōshun sake tour (it ends at 4:30, too late for Nabana).\r\n\r\n**Rain backup** (in place of Nabana), or if everyone ends up together for the last night: a sit-down group dinner in Sakae. Best fit: **Chita beef** at **Chita-gyu Yakiniku to Basashi Niji** (知多牛焼肉と馬肉 虹), 4-21-17 Sakae, 1F Elizabeth Garden Bldg, ~8 min from Yaba-cho Station. A5 Chita beef yakiniku; the signature is the **sukiyaki-style Chita beef cheek** (¥1,078, with raw egg). Chita beef course ¥4,500 with 2 hrs of all-you-can-drink. 6:00 PM–4:00 AM, **closed Wednesdays** (Sunday is fine). Book on Hot Pepper\r\n\r\n## Travel\r\n- Hotel → Nagoya Castle: on foot, ~15 min (the hotel is by **Hisaya-odori** Station, ~1 km from the East Gate), or Meijo Line 1 stop to Nagoyajo\r\n- Hotel → **Atsuta Jingu**: Meijo Line from Hisaya-odori to Atsuta Jingu Nishi, 7 stops (~15 min). From the castle, board at Nagoyajo (~20 min)\r\n- Atsuta Jingu → **Nagoya Station**: Meitetsu from Jingu-mae (~3 min walk from the shrine), ~6 min\r\n- Hotel → Nagoya Station: Sakuradori subway from **Hisaya-odori**, 3 stops (~6 min)\r\n- If doing Nabana no Sato: Kintetsu has its own station under Nagoya Station, next to Meitetsu (not the JR side). Buy the ¥3,670 set ticket there (see the Plan); it\u0027s ¥310 cheaper than separate tickets and skips the Nabana ticket window, which can take 30+ min at peak. The last bus from Nabana no Sato to Kintetsu Nagashima is **~10:00 PM on Sundays**\r\n- Suica works on the subway, Kintetsu, and Mie Kotsu buses\r\n\r\n## Lodging\r\n- **Hotel LiVEMAX PREMIUM Nagoya Marunouchi** (booked) — 3 Chome-16-22 Marunouchi, Naka Ward, Nagoya, Aichi 460-0002\r\n- Night 2 of 2. Check-out is Mon Nov 2 before 10:00 AM\r\n\r\n## Foods to try\r\n- **Miso nikomi udon** (Hatcho miso): Yamamotoya Sohonke at the castle, lunch today. Other branches: Matsuzakaya 9F in Sakae (11 AM–9 PM) and JR Central Towers 13F at Nagoya Station (11 AM–11 PM). The original Honke in Sakae is closed Tue/Wed\r\n- **Chita beef** (知多牛): branded beef from the Chita Peninsula south of Nagoya. Niji in Sakae (see the dinner option above) is the pick. The official Chita beef site lists other Nagoya restaurants that serve it\r\n- **Uiro to take home**: Osu Uiro (bought on Oct 31) or the station souvenir shops at Nagoya Station before the Hida Express on Nov 2\r\n- **Miso oden**: no good Sunday spot found in Sakae. Order it or doteni if an izakaya has it\r\n- **Hitsumabushi** (grilled eel over rice, Nagoya\u0027s signature dish): **Hitsumabushi Ino** in Esca, ~3:40 PM today, between Atsuta Jingu and Nabana. Atsuta Horaiken (the famous original, by the shrine) was skipped: its lunch service ends ~2:00–2:30 PM and it doesn\u0027t reopen until 4:30. Backup at the station: **Hitsumabushi Bincho** (Esca and Dai Nagoya Building), but it closes 3:30–5:00 PM. Hours are from listings, not confirmed\r\n\r\n## TODO\r\n- [x] Evening: Nabana no Sato illumination (decided)\r\n- [x] Afternoon: Atsuta Jingu (decided)\r\n- [x] Nabana no Sato: 2026–27 admission confirmed at ¥2,500 (Oct 17–Nov 20, official fee page); buying the ¥3,670 Kintetsu set ticket instead. Last bus on a Sunday is ~10:00 PM\r\n\r\n**Sources:** [Yamamotoya Sohonke shops](https://yamamotoya.co.jp/shoplist/) · [Niji (Hot Pepper)](https://www.hotpepper.jp/strJ004025571/) · [Chita beef restaurant list](https://chitagyu.co.jp/shop) · [Osu Uiro main store](https://www.nagoya-info.jp/souvenir/detail/35/) · [Nabana no Sato illumination prices](https://www.nagashima-onsen.co.jp/nabana/illumination/fee/index.html) · [Kintetsu Nagashima ⇔ Nabana no Sato bus](https://www.nagashima-onsen.co.jp/nabana/illumination/info/bus_kintetsu_nagahsimaeki_nabana.html) · [Nagoya Castle](https://likenagoya.com/nagoya-castle/) · [Tōshun brewery tour](https://discovernagoyatours.com/tours/2104.html)\r\n"},{"id":"2026-11-02","md":"# Day 7 — Mon Nov 2 — Nagoya → Takayama (Hida Express, old town, sake breweries)\r\n\r\n**Group split:** Dan goes to Takayama. Jeff, Adam, and Max go to Kyoto/Osaka.\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 8:15 AM | Check out. Sakuradori Line from **Hisaya-odori**, 3 stops to Nagoya (~6 min), plus ~10 min walking to the JR gates |\r\n| 8:30 AM | Grab breakfast near Nagoya Station before boarding |\r\n| 9:39 AM | **Hida 5** departs Nagoya (booked) — scenic mountain gorge ride, treat it as part of the sightseeing |\r\n| ~12:15 PM | Arrive Takayama. **Before leaving the station, buy the Wed Nov 4 ticket**: reserved seat on **Hida 3**, Takayama 11:03 AM → Toyama 12:32 PM (ticket office or machine). Then drop bags at the hotel or a station coin locker |\r\n| 1:00 PM | **Lunch** near old town |\r\n| 2:00 PM | **Sanmachi Suji old town** — preserved Edo-era merchant streets; sake breweries marked by cedar balls (sugidama) hanging out front. 45–60 min wander |\r\n| 3:00 PM | **Sake brewery tastings** along Sanmachi Suji, in order of closing time (Google): **Niki** (closes 4:00) → **Hirase** and **Hirata** (close 4:30) by ~4:15, then **Kawashiri** and the **Oita** shop (close 5:00). Finish at **Harada** (sake soft serve) or **Funasaka**, both open to **6:00**, ~5:15–6:00 (see Sake Breweries in [city-ideas.md](../city-ideas.md)) |\r\n| ~4:45 PM | **Hida beef skewer** from a street vendor in old town (e.g. Hida Kotte Ushi, closes 5:00) — one of the best cheap bites in Japan. Grab it between Kawashiri/Oita and the last brewery, before the stalls close at ~5 |\r\n| 5:30 PM | Check in to hotel (if not already done), freshen up |\r\n| 7:00 PM | **Dinner** — old town izakaya or kaiseki. Splurge option: **Ryotei Susaki** (Michelin ★★, ~¥13,000 / ~$87 for the 11-dish Honzen Kuzushi course) — tatami seating, kimono service, shoes off; book well ahead (reservation only, dinner 5–9 PM, last entry 7 PM). **Backups if Susaki is full:** ① **Shiki no Gochisou Mitsuiwa** — kaiseki with Hida beef fillet/loin steak + seasonal seafood, ~¥6,000 basic dinner / ~¥10,000–20,000 full kaiseki, ~4 min walk from the station, dinner **5:00–8:30 PM** (Google), arrive by ~7, closes irregularly, reserve ahead ② **Hida Takayama Sakana** — seasonal Hida kaiseki (autumn mushrooms + A5 Hida beef), ~¥15,000–25,000, reservation only, 1126-1 Echigo-machi, 5:30–9:30 PM ③ **Kyoya** — no-reservation fallback; rustic old house, Hida beef grilled at the table + hoba miso. Monday hours are **11 AM–2 PM and 5–8 PM** (Google; closed Tue), so arrive by **~6:30 PM**. For any of these, check they\u0027ll book a party of 1 |\r\n| 8:30 PM | **Night walk: Sanmachi Suji after dark** — old town is lantern-lit and nearly empty once the shops close. Walk the three parallel lanes (Ichino-machi, Nino-machi, Sanno-machi) north → south. Best photo walk of the day. ~30 min |\r\n| 9:00 PM | **Nakabashi Bridge** — the red bridge at the south end of old town, softly lit at night. Linger on the Miyagawa riverside, then cross to the west bank. ~15 min |\r\n| 9:15 PM | **Nightcap at Red Hill Pub** — 2-4 Sowa-machi, ~5–10 min walk west of the bridge. Small, friendly bar, local sake, jazz/rock/old pop, easy to meet other travelers. 7 PM–midnight. *Alt:* wander the tiny izakaya lanes in Sowa-machi 2-chome / Asahi-machi, or Dekonaru Yokocho (food-stall alley near the station, some stalls till ~11) |\r\n| 10:00 PM | Walk back to hotel (~10 min). **Early night** — Kamikochi buses tomorrow can\u0027t be reserved, so you want an early start |\r\n\r\n## Travel\r\n- Check out: Nagoya hotel before 10:00 AM (aim for ~8:15)\r\n- Hotel → Nagoya Station: Sakuradori subway from **Hisaya-odori**, 3 stops (~6 min), then ~10 min to the JR gates. Allow ~10 min at the ticket machine to print the Hida 5 ticket; be on the platform by 9:25\r\n- **Booked: Hida 5**, departs Nagoya **9:39 AM** → arrives Takayama ~12:15 PM (~2h35). Reserved seat, ¥6,140–6,340 depending on JR\u0027s season tier (~$41–42)\r\n- The train reverses at Gifu (~20 min in). The river/gorge views are on the right side heading toward Takayama (A seats)\r\n\r\n## Lodging\r\n- Check in: **Hida Takayama Washington Hotel Plaza** (booked) — 5-20 Hanasato-cho, Takayama 506-0026 (across from JR Takayama Station). Check-in 3:00 PM; drop bags early if needed\r\n- Night 1 of 2\r\n\r\n## TODO\r\n- [x] Reserve the Hida Limited Express seat (Nagoya → Takayama): Hida 5, 9:39 AM\r\n- [ ] Print the ticket at a Nagoya Station ticket machine before boarding\r\n- [ ] At Takayama Station on arrival: buy the **Hida 3** reserved seat for Wed Nov 4 (Takayama 11:03 AM → Toyama 12:32 PM). Unreserved seats exist, but it\u0027s foliage season and the only morning train\r\n- [ ] At hotel check-in (or Nov 3): ask the **Takayama Washington Hotel** front desk to call **Myoryuji** (+81-76-241-0888) and book 3 people for **Fri Nov 6 at 2:30 PM** (3:00 backup). If it works, skip the intercom stop on [Nov 4](./2026-11-04.md)\r\n- [ ] Decide on / book Ryotei Susaki if doing the Michelin dinner tonight (byFood / Gurunavi online, or +81-577-32-0023; pick the course at booking; free cancellation up to 48 hrs before). If full → book Mitsuiwa or Sakana instead\r\n"},{"id":"2026-11-03","md":"# Day 8 — Tue Nov 3 — Takayama (Kamikochi day trip)\r\n\r\n**Note:** Nov 3 is Culture Day (文化の日), a national holiday — expect heavier crowds on buses and at Kamikochi. The buses can\u0027t be reserved (first come, first served), so go early and don\u0027t cut the return close.\r\n\r\n## Plan\r\n\r\n**Getting there:** Nohi Bus from Takayama Bus Terminal → Hirayu Onsen (transfer) → Kamikochi, ~1h45 each way. Terminal is right across from JR Takayama Station (~5 min walk from the hotel). Plan is built around the **7:00 AM bus**; 7:40 also works. The 6:00 beats the crowds but arrives before Trois Cinq and Kamonjigoya open, so only take it if you\u0027ll start with the walk and eat later. Buses leave Kamikochi every 30 min; the last connection back to Takayama departs 5:00 PM.\r\n\r\n**No reservations:** every bus is unreserved and boards in queue order. On a busy day (this is a national holiday) you may have to wait for the next bus.\r\n\r\n**Tickets:** buy a **Takayama ↔ Kamikochi round-trip ticket** at the Bus Center counter before boarding. It covers both legs each way (Takayama–Hirayu + Hirayu–Kamikochi shuttle) and is cheaper than leg-by-leg. IC/QR payment accepted; carry cash as backup (can only pay onboard when the counter is closed).\r\n\r\n**Numbered return ticket (seiriken):** as soon as you arrive in Kamikochi, go to the window in the **Kamikochi Sightseeing Center** at the bus terminal. Tell them the return bus time and they give you a free numbered ticket — a queue number for that departure, not a seat reservation. On busy days early numbers board first. Get it **before** starting the walk.\r\n\r\nHirayu ↔ Kamikochi shuttle runs through Nov 15, 2026. [Nohi Bus: Kamikochi line](https://www.nouhibus.co.jp/route_bus/kamikochi-line-en/) · [Kamikochi official: access from Takayama](https://www.kamikochi.org/gettinghere/access-to-kamikochi-from-takayama) · [Kamikochi Bus Terminal](https://www.kamikochi.org/spot/kamikochi-bus-terminal)\r\n\r\n### Bus options\r\n\r\n**Confirmed against the 2026 [Nohi Bus timetable](https://www.nouhibus.co.jp/route_bus/kamikochi-line/) (checked Oct 11, 2026).** Season runs Apr 17–Nov 15. There\u0027s no separate holiday timetable: the extra weekend/holiday trips ended Oct 18, so Nov 3 runs the regular schedule.\r\n\r\n**Morning, Takayama → Kamikochi** (pick one that morning):\r\n\r\n| Leave Takayama | Arrive Kamikochi |\r\n|---|---|\r\n| 6:00 AM | 7:25 AM (too early for Trois Cinq and Kamonjigoya, see Schedule) |\r\n| 7:00 AM | 8:30 AM |\r\n| 7:40 AM | 9:10 AM |\r\n| 8:10 AM | 9:35 AM |\r\n\r\n**Afternoon, Kamikochi → Takayama:**\r\n\r\n| Leave Kamikochi | Arrive Takayama | Notes |\r\n|---|---|---|\r\n| 3:00 PM | ~4:31 PM | Safe choice on a holiday |\r\n| 4:00 PM | 5:31 PM | Current plan (Hirayu 4:25 → dep. 4:30) |\r\n| 5:00 PM | 6:31 PM | Last connection to Takayama. Don\u0027t count on it with holiday lines |\r\n\r\nDepartures leave Kamikochi at :00 and :30. A :00 bus makes a quick connection at Hirayu. A :30 bus waits ~35 min at Hirayu, so it gets to Takayama about the same time as the next :00 bus.\r\n\r\n### Schedule\r\n\r\nAll times are rough estimates, shown for the 7:00 AM bus. Shift them for the 6:00 or 7:40.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 6:30 AM | Quick breakfast near the hotel before heading to the bus terminal |\r\n| 7:00 AM | **Nohi Bus departs** Takayama Bus Terminal. Transfer at Hirayu Onsen (~1 hr in) |\r\n| 8:30 AM | Arrive **Kamikochi** (上高地). **First stop: get a numbered return ticket** for the 4:00 PM bus at the Kamikochi Sightseeing Center window |\r\n| 9:00 AM | **Kappa Bridge** — iconic suspension bridge over the Azusa River with Hotaka peaks behind it; the main landmark and starting point for all trails |\r\n| 9:15 AM | **Apple pie** from **Trois Cinq**, by Kappa Bridge. Take it on the walk |\r\n| 9:30 AM | **Azusa River walk north toward Myojin Pond** — ~5 km one-way, completely flat, ~1.5 hrs each way. Best foliage walk in the park; larches along the river corridor turn gold in early November |\r\n| 11:00 AM | **Myojin Pond** area. Rest before heading back |\r\n| 11:00 AM | **Grilled iwana** (mountain char) at **Kamonjigoya**, next to the pond. Open 10:00 AM–2:00 PM (food served through Nov 10). No reservations, and the iwana sells out, so go straight there on arrival rather than after the pond |\r\n| 11:45 AM | Walk back south to Kappa Bridge (~1.5 hrs) |\r\n| 1:15 PM | **Lunch** near Kappa Bridge. Options: **Gosenjaku Kitchen** (sanzoku-yaki set, 11 AM–3 PM, ticket machine), **Alpenrose** at the Imperial Hotel (beef curry, the splurge, last order 2:00 PM), or **Cafe Konashi** (Kamikochi croquette, quick and cheap, 9 AM–3 PM). **None take reservations**, so expect holiday lines |\r\n| 2:15 PM | **Taisho Pond** — 15–20 min south of Kappa Bridge on foot. Reflection of Yakedake volcano, especially striking with autumn color; quieter than the bridge area. Taisho-ike Hotel\u0027s sanzoku-yaki is **lunch only (11 AM–1 PM)**, so get sanzoku at Gosenjaku Kitchen instead; coffee here is fine (restaurant open to 4 PM) |\r\n| 4:00 PM | **Bus back** from Kamikochi (be back at the terminal by ~3:45 with your numbered ticket). The last connection to Takayama is 5:00 PM |\r\n| 5:31 PM | Back in Takayama |\r\n| 6:00 PM | **Dinner at Kitchen Hida** — casual Hida beef steak sets, 1-66 Hon-machi, a short walk from Sanmachi Suji. Dinner 5:00–8:30 PM, **last order 7:45 PM**, so don\u0027t drift in late. Tel 0577-36-2911. On the way out, buy their **bottled Hida beef side dish** at the counter (good souvenir). Closed Wednesdays, so tonight is the last chance. *Backups:* **Maruaki** (A5 Hida beef, open Tuesdays, ~5 min from the hotel) or anything left from the Day 7 list |\r\n| 7:30 PM | **Sanmachi Suji evening stroll** — quieter after day-trippers leave, and lantern-lit after dark |\r\n\r\n**Optional idea: Shinhotaka Ropeway** (not in the plan). A two-stage ropeway, the second stage in Japan\u0027s only double-decker gondola, up to a rooftop deck at 2,156 m with a panoramic view of the Northern Alps. It\u0027s only worth it on a clear day, because on a cloudy one you ride up into fog. Fitting it in on Nov 3 would mean dropping the Myojin Pond walk: bus Kamikochi → Hirayu Onsen → Shinhotaka (~30 min from Hirayu), then a separate bus back to Takayama. Adds ~2.5 hrs; the ropeway alone is **¥3,800 round trip**. Consider it only if the forecast is clear and you would rather have views than the river walk. Not closed for maintenance on Nov 3 (2026 closures are Jun 15–26 and Nov 24–27). November last ride up is ~4:00 PM (unconfirmed). Shinhotaka → Takayama buses leave 1:46, 2:55, 3:55, 4:55, 5:55 PM ([Nohi Bus Shinhotaka line](https://www.nouhibus.co.jp/route_bus/shinhotaka-line/)).\r\n\r\n## Foods to try\r\n\r\n- **Grilled iwana** (mountain char, wood-fire grilled) — **Kamonjigoya**, Myojin Pond\r\n- **Apple pie** (local Fuji apples) — **Trois Cinq**, Kappa Bridge\r\n- **Sanzoku-yaki** (garlic-soy fried chicken thigh) — **Gosenjaku Kitchen**, Gosenjaku Hotel; or **Taisho-ike Hotel**, Taisho Pond (lunch only, 11 AM–1 PM)\r\n- **Imperial Hotel beef curry** — **Alpenrose**, Kamikochi Imperial Hotel\r\n- **Kamikochi croquette** (Shinshu beef) — **Cafe Konashi**, Hotel Shirakabaso\r\n- **Shinshu soba** (Nagano buckwheat noodles) — **Kamikochi Shokudo**, bus terminal\r\n- **Hone-zake** (hot sake over smoked char) — **Kamonjigoya**, Myojin Pond\r\n- **Rare cheesecake** — **Lounge**, Gosenjaku Hotel\r\n\r\nSources: [Kamikochi guide](https://www.kamikouchi.info/en/hotel/foods.html) · [Nap-camp](https://www.nap-camp.com/mag/21710) · [GOOD LUCK TRIP](https://www.gltjp.com/en/directory/item/15049/)\r\n\r\n## Lodging\r\n- **Hida Takayama Washington Hotel Plaza** (booked) — Night 2 of 2. Check-out tomorrow morning\r\n\r\n## TODO\r\n- [ ] Buy the Takayama ↔ Kamikochi **round-trip ticket** at the Bus Center counter before boarding. Bring cash in case IC or card doesn\u0027t work\r\n- [ ] Get the **numbered return ticket** at the Kamikochi terminal right after arriving\r\n- [ ] Get to the Bus Center early for the 7:00 AM bus (line up by ~6:40). No reservations, and it\u0027s a holiday\r\n- [x] Check the last return bus time from Kamikochi: 5:00 PM (→ Takayama 6:31), confirmed on the 2026 Nohi timetable. Plan is the 4:00 PM\r\n- [x] Confirm **Kitchen Hida** is open on Tue Nov 3: yes, Hot Pepper lists normal hours on holidays (dinner 5:00–8:30 PM, last order 7:45)\r\n- [ ] Optional: call **Kitchen Hida** (0577-36-2911) to reserve a 6:00 PM table. No online booking\r\n"},{"id":"2026-11-04","md":"# Day 9 — Wed Nov 4 — Takayama → Kanazawa (morning market, train via Toyama)\r\n\r\n## Plan\r\nAll times are rough estimates.\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 7:45 AM | Check out early (the hotel is across from the station) and leave bags at the front desk |\r\n| 8:00 AM | Walk ~10 min to the **Takayama morning markets**, which close at noon. **Jinya-mae opens 6:00 AM**, **Miyagawa 7:00 AM**. Start at **Jinya-mae Asaichi** (in front of Takayama Jinya), then cross the river to **Miyagawa Asaichi**. Breakfast is grazing at the stalls: pickled veg, tamagoyaki, mitarashi dango, Hida beef skewers. Before 9 AM is still ahead of most tour buses |\r\n| 9:30 AM | **Hida Takayama Retro Museum (Showa-kan)** (9:00 AM–5:00 PM daily, **¥1,200**): retro 1950s townscape, playable arcade games, candy shop. ~1 hr |\r\n| **10:30 AM** | **Leave by 10:30.** Back to the hotel for bags (~12–15 min walk, ~1 km), then across to the station |\r\n| **11:03 AM** | **Hida 3** departs Takayama for Toyama. It\u0027s the only morning Hida to Toyama; the next is Hida 7 at 1:17 PM (Toyama 2:51) |\r\n| 12:32 PM | Arrive **Toyama**. Transfer to the Shinkansen: **Tsurugi 23 at 12:41** (9-min transfer, ¥2,860; buy the ticket ahead or ride unreserved). Missed it: **Hakutaka 559 at 1:14** (Kanazawa 1:36). Cheap option: Ainokaze/IR local **1:20 → 2:19** (¥1,290) |\r\n| **1:03 PM** | Arrive **Kanazawa** (Tsurugi 23). Drop bags at the hotel (check-in is later) |\r\n| 1:30 PM | Late lunch at the station, so Omicho stays fresh for Fri and Sat: **Maimon Sushi** (conveyor belt, inside Kanazawa Station, 11:00 AM–9:00 PM; good nodoguro and local shrimp) or ramen in the station\u0027s Hyakubangai |\r\n| **~2:15 PM** | Bus (~15 min) or walk (~30 min) to **Myoryuji (Ninja Temple)**, 1-2-12 Nomachi, and **book 3 people for Fri Nov 6 at 2:30 PM** at the intercom on the left of the entrance (open 9:00 AM–4:00 PM). Backup slot: 3:00. Bring cash in case they want the ¥1,200 each up front. Skip this if the Takayama hotel already booked it (see TODO) |\r\n| ~2:45 PM | Walk ~10 min back over the Sai River to **Taproom BREW CLASSIC** (1-3-3 Katamachi), the award-winning local brewery\u0027s taproom, 6 taps. Open **Wed–Sun 1:00–9:00 PM** (closed Mon–Tue) |\r\n| ~4:00 PM | Walk ~10–15 min to **Korinbo**. Browse the **Tatemachi** shopping street. Check in at the hotel tonight; it\u0027s by the station |\r\n| 5:00 PM | **Korinbo Tree Fantasy** illumination after dark (free) |\r\n| 5:45 PM | **Dinner: Kanazawa curry at Turban Curry Honten** (ターバンカレー本店), Hirosaka 1-1-48, Unashin Bldg 1F, ~5 min walk from Korinbo. The original Turban shop (since 1971), one of the two founding Kanazawa-curry chains: thick black roux, katsu on top, shredded cabbage, eaten with a fork off a steel plate. Get the **loin katsu curry**. Open **11:00 AM–8:00 PM** daily |\r\n| 6:45 PM | A pint at **Korinbo Jibiruba**, Kanazawa\u0027s first craft beer bar (2013): wood walls covered in beer stickers, kegs for furniture, rotating taps. **Opens 6:00 PM on weekdays** (3 PM weekends), closed Mondays, **cash only**. Saving Futa\u0027s for the group tomorrow night |\r\n| 7:45 PM | Optional: walk ~10 min into **Katamachi** for a second, small stop at **Ichinokura** (5:00–11:00 PM; live crab tank all year, walk-ins OK, counter seats): the crab-miso shell roast (~¥1,700) and some **Kanazawa oden**. Or a nightcap in Katamachi |\r\n| ~9:00 PM | Back to the hotel (bus or ~25 min walk) |\r\n\r\n**Kept light on purpose.** Everything big is saved for when Jeff and Adam are here: Kenrokuen, the castle, Omicho, Nagamachi and Nomura House, and Myoryuji on [Nov 6](./2026-11-06.md); Higashi Chaya and the Omicho crab lunch on [Nov 7](./2026-11-07.md).\r\n\r\n## Travel\r\n- Check out: **Hida Takayama Washington Hotel Plaza** — before 10:00 AM\r\n- **Hida Express** Takayama → Toyama (~1.5 hrs), then **Shinkansen** Toyama → Kanazawa (Tsurugi 23, 12:41 → 1:03, ~22 min) or the **Ainokaze/IR local** (1:20 → 2:19, ~1 hr). ~2 hrs total, more flexible timing than the bus\r\n\r\n## Lodging\r\n- Check in: **Hotel Livemax Kanazawaekimae** (booked) — Night 1 of 3\r\n- Jeff and Adam arrive tomorrow (Nov 5), so the room needs to sleep 3 from then on (confirmed Oct 24)\r\n\r\n**Line status:** the Takayama Line\u0027s Sugihara–Inotani section (between Takayama and Toyama) was closed Mar 18–May 30, 2026, after bridge damage, and closed again for a day of heavy rain on Sep 9. It was running normally as of Oct 20. If it\u0027s closed on the day, take the **Nohi highway bus** Takayama → Kanazawa (~2¼ hrs) instead.\r\n\r\n## TODO\r\n- [ ] Reserve a seat on **Hida 3** (Takayama 11:03 AM → Toyama 12:32 PM). Plan: buy it at Takayama Station on arrival Nov 2 (see [Nov 2](./2026-11-02.md))\r\n- [ ] Check the JR Central line status the day before (Sugihara–Inotani section)\r\n- [ ] **Myoryuji booking:** first ask the Takayama Washington Hotel front desk to call on Nov 2 or 3 (+81-76-241-0888, 3 people, Fri Nov 6 at 2:30 PM). If that works, drop the 2:15 temple stop and go straight to BREW CLASSIC\r\n- [x] Verified Oct 20: hours from Google Maps or official sites. No ~1:15 arrival at Kanazawa, so Tsurugi 23 (1:03) or the local (2:19)\r\n\r\n**Sources:** [Hida down timetable, 2026 (shinkansenkenkyu.com, PDF)](https://shinkansenkenkyu.com/wp-content/uploads/2026/05/56bc4dd204b55fa3e8556d3a88977721.pdf) · [Sugihara–Inotani reopened May 30, 2026 (Mynavi)](https://news.mynavi.jp/article/20260527-4510718/) · [Takayama Line status (Yahoo)](https://transit.yahoo.co.jp/diainfo/200/0) · [Turban Curry Honten (official)](https://r266500.gorp.jp/) · [Toyama → Kanazawa Shinkansen (Ekitan)](https://ekitan.com/timetable/shinkansen/section/501/sf-6293/st-6223) · [Korinbo Jibiruba (official)](https://www.h-highball.jp/jibiruba/)\r\n"},{"id":"2026-11-05","md":"# Day 10 — Thu Nov 5 — Kaga Onsen day trip (Yamanaka, Yamashiro, Natadera), dinner with Jeff and Adam\r\n\r\nDan solo for the day. Jeff and Adam arrive from Kyoto/Osaka sometime today (time not confirmed) and meet up for dinner. Max flies home from Tokyo today.\r\n\r\n## Plan\r\nLocal trains and buses only, no taxis. The order is **Yamanaka → Yamashiro → Natadera** because the buses force it: the only good bus from Yamashiro to Natadera is the 12:40 CAN Bus. The plan takes the **2:24 PM** bus out of Natadera; the **last one is 4:17 PM** (safety net). Times are from Navitime/Ekitan listings for a weekday in Oct 2026. Recheck the week before.\r\n\r\n| Time | What |\r\n|---|---|\r\n| ~7:15 AM | Konbini breakfast near the station |\r\n| **7:32 AM** | **IR Ishikawa local** Kanazawa → Kaga Onsen (~46 min, ¥880, IC card OK). Backup: 7:58 AM (~8:44 arrival) |\r\n| ~8:20 AM | Arrive Kaga Onsen (estimate). Walk to bus stop 2 |\r\n| **8:35 AM** | **Hokutetsu bus** (温泉山中 line, signed 山中温泉行) → Yamanaka Onsen (~31 min, ¥470). **No IC cards** (Suica/ICOCA don\u0027t work, per the official Kaga Onsen site): cash or a contactless credit card. Backups: **9:05** (signed **栢野行**, which runs through Yamanaka Onsen, so it\u0027s fine to board) and **9:50 AM** (山中温泉行) |\r\n| 9:06 AM | **Yamanaka Onsen**: the **Kakusenkei Gorge** walk along the Daishoji River, between **Korogi Bridge** (the curved cypress bridge) and **Kurotani Bridge**, taking in **Ayatori Bridge** (the red-purple S-shaped one). ~1–1.5 hrs. Foliage should be around early-to-mid color |\r\n| ~10:30 AM | **Yuge Kaido**, the main street: **Yamanaka lacquerware** shops and snacks, then an early lunch here. No bath today (nude only, and the one private day-use bath, Ohanami Kyubei, is closed Thursdays). (The **Mokume** woodturning workshop is closed Thursdays.) |\r\n| **11:43 AM** | **Hokutetsu bus** Yamanaka → Yamashiro (~17 min, ~¥330) |\r\n| 12:00 PM | **Yamashiro Onsen**: **Rosanjin\u0027s Iroha Soan** (house museum of the potter-chef Rosanjin; 9:00 AM–5:00 PM, last entry 4:30, ~¥560, closed Wednesdays), the bathhouse square with **Kosoyu** (a reconstructed Meiji-era bathhouse; you can pay to go in, but the baths are nude) and **Kutani pottery** shops |\r\n| **12:40 PM** | **Decision point.** Feeling good and on time: take the **CAN Bus** (mountain route) from the **魯山人寓居跡いろは草庵** stop → Natadera (¥500, pay on board). It\u0027s the only practical bus to Natadera. Tired, late or raining: skip Natadera, take the Hokutetsu bus back to Kaga Onsen Station (~13 min) and the next local train to Kanazawa |\r\n| 12:54 PM | **Natadera Temple**: temple halls built into rock cliffs, caves, a pagoda and a garden known for its autumn color (color usually peaks early-to-late Nov). Official hours 9:15 AM–4:00 PM, open daily. Fee **¥1,000** (official, since Nov 2023). The bus stop is on the temple grounds. ~1.5 hrs |\r\n| **2:24 PM** | **CAN Bus** Natadera → Kaga Onsen Station (¥500). Not the last bus: the **4:17 PM** (Kaga Onsen 4:56) is the safety net if you linger, then the 5:07 local (Kanazawa 5:55) or Tsurugi 30 at 5:18 (5:36) |\r\n| 3:03 PM | Arrive Kaga Onsen |\r\n| **3:20 PM** | **Tsurugi 26** Shinkansen → Kanazawa (¥2,640 unreserved, ~19 min). An hour earlier than the local. Cheaper: **IR Ishikawa local 3:55 PM** (¥880, Kanazawa 4:41) with ~50 min at the **Abio City** mall by the station |\r\n| **3:39 PM** | **Back in Kanazawa.** Rest at the hotel, meet **Jeff and Adam** |\r\n| 7:00 PM | Dinner at **Ajidokoro Takasaki**, 1-2-22 **Nagamachi** (~20 min walk or a short bus from the station): the famous **crab cream croquette** (red snow crab, year-round) and crab from the tank. Open 5:00–10:00 PM, closed Sundays, so Thursday is fine. **Reserve** (076-231-0116, or online via byFood/Tabelog) |\r\n| 8:30 PM | Walk ~10 min to **Korinbo Tree Fantasy** (Jeff and Adam haven\u0027t seen it) |\r\n| 9:00 PM | Craft beer in Korinbo: **Craft Beer Dive Futa\u0027s** (3:00–10:00 PM, closed Tuesdays; 8 rotating taps, served in Kutani pottery made by the owner\u0027s father). Backup: **Craft Beer Mugibatake** (6 Japanese craft taps, no table charge). Then Katamachi if anyone\u0027s still going |\r\n\r\n**More time in Yamashiro instead:** take the **10:50 AM** bus from Yamanaka (arrives 11:04) and have lunch in Yamashiro. That gives ~1h45 in Yamanaka and ~1.5 hrs in Yamashiro.\r\n\r\n**If things slip:**\r\n- **Late leaving Kanazawa:** take the 9:05 or 9:50 AM bus to Yamanaka and shorten the time there. The rest of the day doesn\u0027t change\r\n- **Missed the 12:40 CAN Bus:** Natadera is out (there\u0027s no other way there and back in time). Stay longer in Yamashiro, then take the Hokutetsu bus back to the station (~13 min) and an earlier train\r\n- **Rain:** Yamanaka\u0027s lacquerware shops and Iroha Soan are indoors, but the gorge walk and Natadera are outdoors. In heavy rain, consider staying in Kanazawa (Omicho, Nomura House, a gold-leaf workshop) and doing the Kaga trip another time\r\n\r\n**Natadera in the morning instead (clunkier):** 7:32 AM train, then the 8:40 AM CAN Bus from Kaga Onsen Station → Natadera 9:09. Take the 10:57 bus back to the station (11:36), then wait until ~12:30 for a Hokutetsu bus to Yamanaka. The 3:50 PM bus from Yamanaka gets back to the station at 4:21 for the 4:23 or 4:53 PM train (Kanazawa 5:09 or 5:38). Yamashiro gets squeezed.\r\n\r\n**For Jeff and Adam if they arrive early:** Nagamachi (the samurai lanes and Nomura House, open until 4:00 PM) is right by the restaurant. Higashi Chaya is ~10 min by bus from the station, but its shops close ~5–6 PM. Otherwise Nagamachi is on the [Nov 6](./2026-11-06.md) afternoon and Higashi Chaya on the [Nov 7](./2026-11-07.md) morning, both with Dan.\r\n\r\n## Travel\r\n- **Kanazawa ⇄ Kaga Onsen:** IR Ishikawa local, ~46 min, ¥880 each way, IC card OK. The Shinkansen (Tsurugi, ~18 min, ¥2,640 unreserved) saves ~30 min each way and costs ~¥3,500 more for the day. Kagayaki trains mostly skip Kaga Onsen\r\n- **Hokutetsu Kaga Bus** (温泉山中 line): Kaga Onsen Station (stop 2) → Yamashiro Onsen (~13 min) → Yamanaka Onsen (~31 min), about twice an hour. **No IC cards**: cash or a contactless credit card\r\n- **CAN Bus** (mountain route): only two rides needed today, ¥500 each, pay on board. A 1-day pass isn\u0027t worth it. Departures from Kaga Onsen Station toward Natadera: 8:40, 10:05, 12:25, 1:55, 3:25. Departures from Natadera to the station: 9:09, 10:57, 12:54, 2:24, **4:17 (last)**, per the official 2026 pamphlet. Unreserved, and buses can refuse riders when full in foliage season, so board one stop early at the Yamashiro South Exit stop (12:39) if you can\r\n- Jeff and Adam from Kyoto/Osaka: Thunderbird to Tsuruga, then the Hokuriku Shinkansen to Kanazawa, ~2–2.5 hrs from Kyoto\r\n\r\n**Cost for the day:** trains ¥1,760 (¥3,520 with the Tsurugi back) + Hokutetsu buses ~¥800 + CAN Bus ¥1,000 ≈ **¥3,560–5,320**, plus ~¥560 for Iroha Soan and ¥1,000 for Natadera. (Ekitan lists the IR fare as ¥1,330 vs Navitime\u0027s ¥880; IC card handles it either way.)\r\n\r\n## Lodging\r\n- **Hotel Livemax Kanazawaekimae** (booked)\r\n- Night 2 of 3. Room sleeps 3 from tonight (confirmed Oct 24)\r\n\r\n## TODO\r\n- [x] Decided: doing the Kaga day trip (compared with Eiheiji, Takaoka, Noto and an easy Kanazawa day). Natadera is optional, decided at 12:40 in Yamashiro. Heavy-rain call the night of Nov 4\r\n- [ ] Confirm Jeff and Adam\u0027s arrival time\r\n- [ ] **Reserve Ajidokoro Takasaki** for 3 at ~7:00 PM (076-231-0116, or byFood/Tabelog/KKday)\r\n- [x] Takasaki is open Thursdays (closed Sundays) and is in Nagamachi, not near Kazuemachi. Evening walk re-routed via Korinbo\r\n- [x] **12:40 PM CAN Bus** from the Iroha Soan stop is in the official 2026 pamphlet (Natadera 12:54). The CAN Bus desk at Kaga Onsen Station: 0761-72-6678\r\n- [ ] Recheck all train and bus times the week before\r\n- [ ] Bring cash (yen coins and small notes) for the Hokutetsu and CAN buses\r\n- [x] Mokume\u0027s woodturning workshop is closed Thursdays (Google Maps), so it\u0027s out\r\n- [x] CAN Bus timetable: built the day around it (Yamanaka → Yamashiro → Natadera)\r\n- [x] Natadera hours: 9:15 AM–4:00 PM, open daily, ¥1,000 (official site). Iroha Soan: closed Wednesdays, so Thursday is fine\r\n- [x] Verified Oct 20: last CAN Bus out of Natadera is 4:17 PM (not 2:24); Tsurugi 26 at 3:20 from Kaga Onsen gets back at 3:39. Confirm the 4:17 with the CAN desk (0761-72-6678), since the pamphlet is the spring edition\r\n- [x] Looked for a **private bath** in Yamanaka. The only day-use one found, **Ohanami Kyubei**, is **closed Thursdays**, so no soak today\r\n\r\n**Sources:** [Kaga Onsen official: local buses, no IC cards](https://www.tabimati.net/rosen_bus_new/) · [NAVITIME: CAN Bus, Kaga Onsen → Natadera](https://www.navitime.co.jp/bus/diagram/timelist?departure=00502130\u0026arrival=00257125\u0026line=00079063) · [NAVITIME: Natadera → Kaga Onsen](https://www.navitime.co.jp/bustransit/search?orvStationCode=00257125\u0026dnvStationCode=00502130) · [NAVITIME: Kaga Onsen → Yamanaka bus](https://www.navitime.co.jp/bus/diagram/timelist?departure=00042719\u0026arrival=00257146\u0026line=00050458) · [NAVITIME: Yamanaka → Yamashiro bus](https://www.navitime.co.jp/bus/diagram/timelist?departure=00257146\u0026arrival=00257124\u0026line=00050458) · [NAVITIME: Yamanaka → Kaga Onsen bus](https://www.navitime.co.jp/bus/diagram/timelist?departure=00257146\u0026arrival=00042719\u0026line=00050458) · [NAVITIME: Kanazawa → Daishoji local trains](https://www.navitime.co.jp/diagram/depArrTimeList?departure=00001888\u0026arrival=00005658\u0026line=00001230\u0026updown=0) · [NAVITIME: Kaga Onsen → Kanazawa local trains](https://www.navitime.co.jp/diagram/depArrTimeList?departure=00001015\u0026arrival=00001888\u0026line=00001230\u0026updown=1) · [Ekitan: Kaga Onsen → Kanazawa Shinkansen](https://ekitan.com/transit/shinkansen/section/sf-6220/st-6223) · [Hot Ishikawa CAN Bus blog](https://www.hot-ishikawa.jp/blog/detail_472.html) · [CAN Bus 2026 pamphlet (PDF)](https://tabimati.net/lsc/api/pamphlet/download.php?id=63) · [Natadera official hours](https://natadera.com/hiakan/) · [Iroha Soan facility info](https://iroha.kagashi-ss.com/facility/) · [Kaga Onsen (japan.travel)](https://www.japan.travel/en/spot/2189/) · [Ohanami Kyubei day use](https://www.ohanami-kyubei.jp/dayplan/) · [Visit Kaga — hot springs (PDF)](https://visitkaga.jp/files/download/en/hotspring.pdf) · [Ajidokoro Takasaki (byFood)](https://www.byfood.com/restaurant/ajidokoro-takasaki-22100)\r\n"},{"id":"2026-11-06","md":"# Day 11 — Fri Nov 6 — Kanazawa (Kenrokuen, castle, Omicho, Nagamachi, Ninja Temple, Nishi Chaya at dusk, jibu-ni in Katamachi)\r\n\r\nThe one full day with Jeff and Adam in Kanazawa. Crab season opens today, but the first auction isn\u0027t until ~7:30 PM tonight, so local crab isn\u0027t in shops until tomorrow (see [city-ideas.md](../city-ideas.md)).\r\n\r\n## Plan\r\nAll times are rough estimates. **All on foot, no taxis:** the day covers central Kanazawa (garden, castle, Omicho, Nagamachi), then crosses the Sai River to the south side (Myoryuji, Teramachi, Nishi Chaya) and walks back over the river to dinner. Most legs are 10–20 min; the longest are the morning walk to Kenrokuen (~25–30) and the walk to dinner (~15–30). The one fixed booking is **Myoryuji at 2:30 PM**. The east side (Higashi Chaya) is Saturday morning: see [Nov 7](./2026-11-07.md).\r\n\r\n| Est. time | What |\r\n|---|---|\r\n| 7:45 AM | **Walk** from the hotel
